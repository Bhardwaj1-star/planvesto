[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planvesto-backend"
version = "0.1.0"
description = "PlanVesto - Investor-First Financial Decision System Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = [".", "backend"]
