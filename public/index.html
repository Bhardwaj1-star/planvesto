======================================== -->\n\n<section\n    id=\"requirement\"\n    class=\"scroll-mt-32 py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[0.8fr_1.2fr] lg:items-start\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                    01 · Investment requirement\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                    Start with what the money needs to do.\n                <\/h2>\n\n                <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                    The right investment depends on the purpose of the money.\n                    A retirement investment and a short-term liquidity reserve\n                    do not necessarily have the same job.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"grid gap-4 sm:grid-cols-2\">\n\n                <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                    <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-navy-900 text-white\">\n\n                        <svg\n                            class=\"h-5 w-5\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n                            <circle\n                                cx=\"12\"\n                                cy=\"12\"\n                                r=\"9\"\n                                stroke-width=\"1.8\"\n                            />\n\n                            <path\n                                d=\"M12 7v5l3 2\"\n                                stroke-width=\"1.8\"\n                                stroke-linecap=\"round\"\n                            />\n                        <\/svg>\n\n                    <\/div>\n\n                    <h3 class=\"mt-5 font-bold text-navy-900\">\n                        Time horizon\n                    <\/h3>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        When will the money be needed?\n                    <\/p>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                    <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-teal-50 text-teal-700\">\n\n                        <svg\n                            class=\"h-5 w-5\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n                            <path\n                                d=\"M4 19V5M4 19h16\"\n                                stroke-width=\"1.8\"\n                                stroke-linecap=\"round\"\n                            />\n\n                            <path\n                                d=\"M8 15l3-4 3 2 5-7\"\n                                stroke-width=\"1.8\"\n                                stroke-linecap=\"round\"\n                                stroke-linejoin=\"round\"\n                            />\n                        <\/svg>\n\n                    <\/div>\n\n                    <h3 class=\"mt-5 font-bold text-navy-900\">\n                        Required outcome\n                    <\/h3>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        What financial outcome does the investment need to support?\n                    <\/p>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                    <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-slate-100 text-navy-900\">\n\n                        <svg\n                            class=\"h-5 w-5\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n                            <path\n                                d=\"M12 3l8 4v5c0 4.8-3.4 7.9-8 9-4.6-1.1-8-4.2-8-9V7l8-4z\"\n                                stroke-width=\"1.8\"\n                                stroke-linejoin=\"round\"\n                            />\n                        <\/svg>\n\n                    <\/div>\n\n                    <h3 class=\"mt-5 font-bold text-navy-900\">\n                        Risk\n                    <\/h3>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        What level of financial risk fits your circumstances?\n                    <\/p>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                    <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-slate-100 text-navy-900\">\n\n                        <svg\n                            class=\"h-5 w-5\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n                            <path\n                                d=\"M5 7h14M5 12h14M5 17h9\"\n                                stroke-width=\"1.8\"\n                                stroke-linecap=\"round\"\n                            />\n                        <\/svg>\n\n                    <\/div>\n\n                    <h3 class=\"mt-5 font-bold text-navy-900\">\n                        Liquidity\n                    <\/h3>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        How much flexibility does the money need to retain?\n                    <\/p>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     RISK\n========================================================= -->\n\n<section\n    id=\"risk\"\n    class=\"scroll-mt-32 bg-white py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[1fr_1fr] lg:items-center\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                    02 · Risk\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                    Risk is about more than how you feel about markets.\n                <\/h2>\n\n                <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                    Investment decisions need to consider both your willingness\n                    to take risk and your financial ability to absorb it.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-[28px] border border-slate-200 bg-slate-50 p-6 sm:p-8\">\n\n                <div class=\"space-y-6\">\n\n                    <div>\n\n                        <div class=\"flex items-center justify-between\">\n\n                            <h3 class=\"font-bold text-navy-900\">\n                                Risk capacity\n                            <\/h3>\n\n                            <span class=\"text-xs font-bold text-teal-700\">\n                                Financial ability\n                            <\/span>\n\n                        <\/div>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                            How much financial loss or volatility can your\n                            overall circumstances reasonably absorb?\n                        <\/p>\n\n                    <\/div>\n\n\n                    <div class=\"h-px bg-slate-200\"><\/div>\n\n\n                    <div>\n\n                        <div class=\"flex items-center justify-between\">\n\n                            <h3 class=\"font-bold text-navy-900\">\n                                Risk tolerance\n                            <\/h3>\n\n                            <span class=\"text-xs font-bold text-teal-700\">\n                                Personal willingness\n                            <\/span>\n\n                        <\/div>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                            How comfortable are you with uncertainty and\n                            fluctuations in investment outcomes?\n                        <\/p>\n\n                    <\/div>\n\n\n                    <div class=\"h-px bg-slate-200\"><\/div>\n\n\n                    <div>\n\n                        <div class=\"flex items-center justify-between\">\n\n                            <h3 class=\"font-bold text-navy-900\">\n                                Investment context\n                            <\/h3>\n\n                            <span class=\"text-xs font-bold text-teal-700\">\n                                Full picture\n                            <\/span>\n\n                        <\/div>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                            Goals, horizon, liquidity, existing investments\n                            and financial circumstances all matter.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     ASSET ALLOCATION\n========================================================= -->\n\n<section\n    id=\"allocation\"\n    class=\"scroll-mt-32 py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"max-w-3xl\">\n\n            <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                03 · Asset allocation\n            <\/p>\n\n            <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                Decide what role each part of the portfolio should play.\n            <\/h2>\n\n            <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                Asset allocation connects your investment requirement with\n                the different types of assets that may be used to fulfil it.\n            <\/p>\n\n        <\/div>\n\n\n        <div class=\"mt-14 grid gap-5 md:grid-cols-3\">\n\n            <!-- Growth -->\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-7 shadow-card\">\n\n                <div class=\"flex h-12 w-12 items-center justify-center rounded-2xl bg-navy-900 text-white\">\n\n                    <svg\n                        class=\"h-5 w-5\"\n                        fill=\"none\"\n                        stroke=\"currentColor\"\n                        viewBox=\"0 0 24 24\"\n                    >\n                        <path\n                            d=\"M4 19V5M4 19h16\"\n                            stroke-width=\"1.8\"\n                            stroke-linecap=\"round\"\n                        />\n\n                        <path\n                            d=\"M8 15l3-4 3 2 5-7\"\n                            stroke-width=\"1.8\"\n                            stroke-linecap=\"round\"\n                            stroke-linejoin=\"round\"\n                        />\n                    <\/svg>\n\n                <\/div>\n\n                <h3 class=\"mt-6 text-xl font-bold text-navy-900\">\n                    Growth\n                <\/h3>\n\n                <p class=\"mt-3 text-sm leading-6 text-slate-500\">\n                    Assets intended to provide long-term growth potential,\n                    with corresponding uncertainty and volatility.\n                <\/p>\n\n            <\/div>\n\n\n            <!-- Stability -->\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-7 shadow-card\">\n\n                <div class=\"flex h-12 w-12 items-center justify-center rounded-2xl bg-teal-50 text-teal-700\">\n\n                    <svg\n                        class=\"h-5 w-5\"\n                        fill=\"none\"\n                        stroke=\"currentColor\"\n                        viewBox=\"0 0 24 24\"\n                    >\n                        <path\n                            d=\"M12 3v18M7 8h8a3 3 0 010 6H9a3 3 0 000 6h8\"\n                            stroke-width=\"1.8\"\n                            stroke-linecap=\"round\"\n                        />\n                    <\/svg>\n\n                <\/div>\n\n                <h3 class=\"mt-6 text-xl font-bold text-navy-900\">\n                    Stability\n                <\/h3>\n\n                <p class=\"mt-3 text-sm leading-6 text-slate-500\">\n                    Assets that may play a role in reducing portfolio\n                    volatility or supporting stability.\n                <\/p>\n\n            <\/div>\n\n\n            <!-- Liquidity -->\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-7 shadow-card\">\n\n                <div class=\"flex h-12 w-12 items-center justify-center rounded-2xl bg-slate-100 text-navy-900\">\n\n                    <svg\n                        class=\"h-5 w-5\"\n                        fill=\"none\"\n                        stroke=\"currentColor\"\n                        viewBox=\"0 0 24 24\"\n                    >\n                        <path\n                            d=\"M12 3v18M7 8h8a3 3 0 010 6H9a3 3 0 000 6h8\"\n                            stroke-width=\"1.8\"\n                            stroke-linecap=\"round\"\n                        />\n                    <\/svg>\n\n                <\/div>\n\n                <h3 class=\"mt-6 text-xl font-bold text-navy-900\">\n                    Liquidity\n                <\/h3>\n\n                <p class=\"mt-3 text-sm leading-6 text-slate-500\">\n                    Resources that need to remain accessible when money\n                    may be required in the near term.\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n\n        <!-- Allocation Example -->\n        <div class=\"mt-8 rounded-[28px] border border-slate-200 bg-white p-6 shadow-soft sm:p-8\">\n\n            <div class=\"grid gap-8 lg:grid-cols-[0.8fr_1.2fr] lg:items-center\">\n\n                <div>\n\n                    <p class=\"text-xs font-bold uppercase tracking-wider text-slate-400\">\n                        Illustrative example\n                    <\/p>\n\n                    <h3 class=\"mt-3 text-2xl font-extrabold tracking-tight text-navy-900\">\n                        One portfolio can have different jobs.\n                    <\/h3>\n\n                    <p class=\"mt-4 text-sm leading-7 text-slate-500\">\n                        Allocation is not simply about choosing a percentage\n                        for each asset class. It is about matching capital\n                        to the requirements of the financial plan.\n                    <\/p>\n\n                <\/div>\n\n\n                <div>\n\n                    <div class=\"flex h-5 overflow-hidden rounded-full bg-slate-100\">\n\n                        <div class=\"w-[50%] bg-navy-900\"><\/div>\n\n                        <div class=\"w-[30%] bg-teal-600\"><\/div>\n\n                        <div class=\"w-[20%] bg-slate-300\"><\/div>\n\n                    <\/div>\n\n\n                    <div class=\"mt-5 grid grid-cols-3 gap-5\">\n\n                        <div>\n\n                            <p class=\"text-xs font-medium text-slate-400\">\n                                Growth\n                            <\/p>\n\n                            <p class=\"mt-1 text-xl font-extrabold text-navy-900\">\n                                50%\n                            <\/p>\n\n                        <\/div>\n\n\n                        <div>\n\n                            <p class=\"text-xs font-medium text-slate-400\">\n                                Stability\n                            <\/p>\n\n                            <p class=\"mt-1 text-xl font-extrabold text-navy-900\">\n                                30%\n                            <\/p>\n\n                        <\/div>\n\n\n                        <div>\n\n                            <p class=\"text-xs font-medium text-slate-400\">\n                                Liquidity\n                            <\/p>\n\n                            <p class=\"mt-1 text-xl font-extrabold text-navy-900\">\n                                20%\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     INVESTMENT SELECTION\n========================================================= -->\n\n<section\n    id=\"selection\"\n    class=\"scroll-mt-32 bg-white py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[0.9fr_1.1fr] lg:items-center\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                    04 · Investment selection\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                    Products come after the requirement.\n                <\/h2>\n\n                <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                    A product is a vehicle. First understand what role the\n                    investment needs to fulfil. Then evaluate products against\n                    that role and the overall portfolio.\n                <\/p>\n\n                <a\n                    href=\"decide.html\"\n                    class=\"mt-8 inline-flex items-center gap-2 text-sm font-bold text-navy-900\"\n                >\n                    Understand the decision process\n                    <span>→<\/span>\n                <\/a>\n\n            <\/div>\n\n\n            <div class=\"rounded-[28px] border border-slate-200 bg-slate-50 p-6 sm:p-8\">\n\n                <div class=\"space-y-4\">\n\n                    <div class=\"flex items-center gap-4 rounded-2xl bg-white p-5 shadow-sm\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-navy-900 text-sm font-bold text-white\">\n                            01\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"text-sm font-bold text-navy-900\">\n                                Define the role\n                            <\/h3>\n\n                            <p class=\"mt-1 text-xs leading-5 text-slate-500\">\n                                What does this investment need to accomplish?\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n\n                    <div class=\"flex items-center gap-4 rounded-2xl bg-white p-5 shadow-sm\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-teal-600 text-sm font-bold text-white\">\n                            02\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"text-sm font-bold text-navy-900\">\n                                Define the requirements\n                            <\/h3>\n\n                            <p class=\"mt-1 text-xs leading-5 text-slate-500\">\n                                Risk, liquidity, horizon and portfolio fit.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n\n                    <div class=\"flex items-center gap-4 rounded-2xl bg-white p-5 shadow-sm\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-sm font-bold text-navy-900\">\n                            03\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"text-sm font-bold text-navy-900\">\n                                Evaluate suitable products\n                            <\/h3>\n\n                            <p class=\"mt-1 text-xs leading-5 text-slate-500\">\n                                Compare available investment vehicles against the requirement.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n\n                    <div class=\"flex items-center gap-4 rounded-2xl bg-white p-5 shadow-sm\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-navy-900 text-sm font-bold text-white\">\n                            04\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"text-sm font-bold text-navy-900\">\n                                Check the whole portfolio\n                            <\/h3>\n\n                            <p class=\"mt-1 text-xs leading-5 text-slate-500\">\n                                Make sure the new investment fits what you already own.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     VALIDATION\n========================================================= -->\n\n<section\n    id=\"validation\"\n    class=\"scroll-mt-32 py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"max-w-3xl\">\n\n            <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                05 · Validation\n            <\/p>\n\n            <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                Before acting, check what the decision changes.\n            <\/h2>\n\n            <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                An investment can look attractive on its own and still be\n                unsuitable for the overall financial plan. The final question\n                is how the resulting portfolio fits the plan.\n            <\/p>\n\n        <\/div>\n\n\n        <div class=\"mt-14 grid gap-5 md:grid-cols-2 lg:grid-cols-4\">\n\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                <div class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                    Check 01\n                <\/div>\n\n                <h3 class=\"mt-4 font-bold text-navy-900\">\n                    Goal impact\n                <\/h3>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Does the investment support the intended goal?\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                <div class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                    Check 02\n                <\/div>\n\n                <h3 class=\"mt-4 font-bold text-navy-900\">\n                    Risk impact\n                <\/h3>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Does the resulting risk remain appropriate?\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                <div class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                    Check 03\n                <\/div>\n\n                <h3 class=\"mt-4 font-bold text-navy-900\">\n                    Liquidity impact\n                <\/h3>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Does enough accessible capital remain available?\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                <div class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                    Check 04\n                <\/div>\n\n                <h3 class=\"mt-4 font-bold text-navy-900\">\n                    Portfolio impact\n                <\/h3>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Does the investment fit with the rest of the portfolio?\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     HOW IT WORKS\n========================================================= -->\n\n<section\n    id=\"how-it-works\"\n    class=\"scroll-mt-32 bg-navy-900 py-24 text-white lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[0.85fr_1.15fr]\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-300\">\n                    How investment planning works\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] sm:text-5xl\">\n                    From purpose to portfolio.\n                <\/h2>\n\n                <p class=\"mt-6 max-w-lg text-base leading-7 text-slate-300\">\n                    The process moves from the financial requirement to the\n                    portfolio rather than starting with a product.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"space-y-7\">\n\n                <div class=\"flex gap-5\">\n\n                    <div class=\"flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        01\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Understand the requirement\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Goal, horizon, required outcome, liquidity and financial context.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"flex gap-5\">\n\n                    <div class=\"flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        02\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Understand risk\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Consider both financial capacity and willingness to take risk.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"flex gap-5\">\n\n                    <div class=\"flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        03\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Build the allocation\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Determine how capital can be distributed across different roles.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"flex gap-5\">\n\n                    <div class=\"flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        04\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Select investments\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Evaluate suitable investment vehicles against the defined requirement.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"flex gap-5\">\n\n                    <div class=\"flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-teal-600 text-sm font-bold\">\n                        05\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Validate the portfolio\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Check the resulting effect on goals, risk, liquidity and the overall plan.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     CTA\n========================================================= -->\n\n<section\n    id=\"start\"\n    class=\"scroll-mt-32 py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"rel
