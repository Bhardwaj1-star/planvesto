anvesto. All rights reserved.\n            <\/p>\n\n\n            <div class=\"flex flex-wrap gap-5 text-xs text-slate-400\">\n\n                <a\n                    href=\"privacy.html\"\n                    class=\"transition hover:text-navy-900\"\n                >\n                    Privacy Policy\n                <\/a>\n\n                <a\n                    href=\"terms.html\"\n                    class=\"transition hover:text-navy-900\"\n                >\n                    Terms & Conditions\n                <\/a>\n\n                <a\n                    href=\"disclaimer.html\"\n                    class=\"transition hover:text-navy-900\"\n                >\n                    Disclaimer\n                <\/a>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/footer>\n\n\n<!-- =========================================================\n     JAVASCRIPT\n========================================================= -->\n\n<script>\n\n    document.addEventListener('DOMContentLoaded', function () {\n\n\n        const menuButton =\n            document.getElementById('menuButton');\n\n        const mobileMenu =\n            document.getElementById('mobileMenu');\n\n        const currentYear =\n            document.getElementById('currentYear');\n\n        const contactForm =\n            document.getElementById('contactForm');\n\n        const submitButton =\n            document.getElementById('submitButton');\n\n        const successMessage =\n            document.getElementById('successMessage');\n\n\n        /* Current year */\n\n        if (currentYear) {\n\n            currentYear.textContent =\n                new Date().getFullYear();\n\n        }\n\n\n        /* Mobile navigation */\n\n        if (menuButton && mobileMenu) {\n\n            menuButton.addEventListener('click', function () {\n\n                const isHidden =\n                    mobileMenu.classList.contains('hidden');\n\n                mobileMenu.classList.toggle('hidden');\n\n                menuButton.setAttribute(\n                    'aria-expanded',\n                    String(isHidden)\n                );\n\n            });\n\n\n            mobileMenu\n                .querySelectorAll('a')\n                .forEach(function (link) {\n\n                    link.addEventListener('click', function () {\n\n                        mobileMenu.classList.add('hidden');\n\n                        menuButton.setAttribute(\n                            'aria-expanded',\n                            'false'\n                        );\n\n                    });\n\n                });\n\n        }\n\n\n        /* Contact form validation */\n\n        if (contactForm) {\n\n            contactForm.addEventListener('submit', function (event) {\n\n                event.preventDefault();\n\n\n                const name =\n                    document.getElementById('name');\n\n                const email =\n                    document.getElementById('email');\n\n                const topic =\n                    document.getElementById('topic');\n\n                const message =\n                    document.getElementById('message');\n\n                const consent =\n                    document.getElementById('consent');\n\n\n                const nameError =\n                    document.getElementById('nameError');\n\n                const emailError =\n                    document.getElementById('emailError');\n\n                const topicError =\n                    document.getElementById('topicError');\n\n                const messageError =\n                    document.getElementById('messageError');\n\n                const consentError =\n                    document.getElementById('consentError');\n\n\n                let valid = true;\n\n\n                /* Reset errors */\n\n                [\n                    nameError,\n                    emailError,\n                    topicError,\n                    messageError,\n                    consentError\n                ].forEach(function (element) {\n\n                    element.classList.add('hidden');\n\n                });\n\n\n                [\n                    name,\n                    email,\n                    topic,\n                    message\n                ].forEach(function (element) {\n\n                    element.classList.remove(\n                        'border-red-400'\n                    );\n\n                });\n\n\n                /* Name */\n\n                if (!name.value.trim()) {\n\n                    nameError.classList.remove('hidden');\n\n                    name.classList.add('border-red-400');\n\n                    valid = false;\n\n                }\n\n\n                /* Email */\n\n                const emailPattern =\n                    /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n\n\n                if (\n                    !email.value.trim() ||\n                    !emailPattern.test(email.value.trim())\n                ) {\n\n                    emailError.classList.remove('hidden');\n\n                    email.classList.add('border-red-400');\n\n                    valid = false;\n\n                }\n\n\n                /* Topic */\n\n                if (!topic.value) {\n\n                    topicError.classList.remove('hidden');\n\n                    topic.classList.add('border-red-400');\n\n                    valid = false;\n\n                }\n\n\n                /* Message */\n\n                if (!message.value.trim()) {\n\n                    messageError.classList.remove('hidden');\n\n                    message.classList.add('border-red-400');\n\n                    valid = false;\n\n                }\n\n\n                /* Consent */\n\n                if (!consent.checked) {\n\n                    consentError.classList.remove('hidden');\n\n                    valid = false;\n\n                }\n\n\n                if (!valid) {\n\n                    return;\n\n                }\n\n\n                /*\n                    Frontend-only success state.\n\n                    Connect this form to the actual Planvesto\n                    backend/email endpoint when the API is available.\n                */\n\n                submitButton.disabled = true;\n\n                submitButton.innerHTML =\n                    'Message Checked ✓';\n\n\n                successMessage.classList.remove(\n                    'hidden'\n                );\n\n\n                successMessage.scrollIntoView({\n                    behavior: 'smooth',\n                    block: 'nearest'\n                });\n\n            });\n\n        }\n\n    });\n\n<\/script>\n\n\n<\/body>\n<\/html>",
"privacy.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n    <title>Privacy Policy — Planvesto<\/title>\n\n    <meta\n        name=\"description\"\n        content=\"Planvesto Privacy Policy.\"\n    >\n\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\n    <link\n        href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\"\n        rel=\"stylesheet\"\n    >\n\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n\n    <script>\n        tailwind.config = {\n            theme: {\n                extend: {\n                    colors: {\n                        navy: {\n                            950: '#061421',\n                            900: '#0B1F33',\n                            800: '#12304A',\n                            700: '#194563'\n                        },\n\n                        teal: {\n                            50: '#F0FDFA',\n                            100: '#CCFBF1',\n                            300: '#5EEAD4',\n                            500: '#14B8A6',\n                            600: '#0F766E',\n                            700: '#115E59'\n                        }\n                    },\n\n                    fontFamily: {\n                        sans: ['Inter', 'sans-serif']\n                    }\n                }\n            }\n        }\n    <\/script>\n\n\n    <style>\n\n        html {\n            scroll-behavior: smooth;\n        }\n\n        body {\n            font-family: 'Inter', sans-serif;\n        }\n\n        .hero-grid {\n            background-image:\n                linear-gradient(rgba(11, 31, 51, 0.045) 1px, transparent 1px),\n                linear-gradient(90deg, rgba(11, 31, 51, 0.045) 1px, transparent 1px);\n\n            background-size: 48px 48px;\n        }\n\n        .mobile-menu {\n            transition: all 0.2s ease;\n        }\n\n        .mobile-menu.hidden {\n            opacity: 0;\n            transform: translateY(-8px);\n            pointer-events: none;\n        }\n\n        .mobile-menu:not(.hidden) {\n            opacity: 1;\n            transform: translateY(0);\n        }\n\n    <\/style>\n<\/head>\n\n\n<body class=\"bg-slate-50 text-slate-800 antialiased\">\n\n\n<!-- =========================================================\n     NAVIGATION\n========================================================= -->\n\n<header class=\"fixed inset-x-0 top-0 z-50 border-b border-slate-200/70 bg-white/90 backdrop-blur-xl\">\n\n    <div class=\"mx-auto flex h-20 max-w-[1200px] items-center justify-between px-5 lg:px-8\">\n\n\n        <a\n            href=\"index.html\"\n            class=\"flex items-center gap-2.5\"\n            aria-label=\"Planvesto Home\"\n        >\n\n            <div class=\"flex h-9 w-9 items-center justify-center rounded-xl bg-navy-900\">\n\n                <svg\n                    class=\"h-5 w-5 text-white\"\n                    viewBox=\"0 0 24 24\"\n                    fill=\"none\"\n                >\n\n                    <path\n                        d=\"M5 17L10 12L13 15L19 8\"\n                        stroke=\"currentColor\"\n                        stroke-width=\"2.2\"\n                        stroke-linecap=\"round\"\n                        stroke-linejoin=\"round\"\n                    />\n\n                    <path\n                        d=\"M15 8H19V12\"\n                        stroke=\"currentColor\"\n                        stroke-width=\"2.2\"\n                        stroke-linecap=\"round\"\n                        stroke-linejoin=\"round\"\n                    />\n\n                <\/svg>\n\n            <\/div>\n\n\n            <span class=\"text-xl font-extrabold tracking-tight text-navy-900\">\n                planvesto\n            <\/span>\n\n        <\/a>\n\n\n        <nav\n            class=\"hidden items-center gap-8 lg:flex\"\n            aria-label=\"Main navigation\"\n        >\n\n            <a\n                href=\"plan.html\"\n                class=\"text-sm font-medium text-slate-600 transition hover:text-navy-900\"\n            >\n                Plan\n            <\/a>\n\n            <a\n                href=\"invest.html\"\n                class=\"text-sm font-medium text-slate-600 transition hover:text-navy-900\"\n            >\n                Invest\n            <\/a>\n\n            <a\n                href=\"protect.html\"\n                class=\"text-sm font-medium text-slate-600 transition hover:text-navy-900\"\n            >\n                Protect\n            <\/a>\n\n            <a\n                href=\"decide.html\"\n                class=\"text-sm font-medium text-slate-600 transition hover:text-navy-900\"\n            >\n                Decide\n            <\/a>\n\n            <a\n                href=\"learn.html\"\n                class=\"text-sm font-medium text-slate-600 transition hover:text-navy-900\"\n            >\n                Learn\n            <\/a>\n\n            <a\n                href=\"about.html\"\n                class=\"text-sm font-medium text-slate-600 transition hover:text-navy-900\"\n            >\n                About\n            <\/a>\n\n        <\/nav>\n\n\n        <div class=\"hidden items-center gap-3 lg:flex\">\n\n            <a\n                href=\"login.html\"\n                class=\"rounded-xl px-4 py-2.5 text-sm font-semibold text-navy-900 transition hover:bg-slate-100\"\n            >\n                Login\n            <\/a>\n\n            <a\n                href=\"login.html\"\n                class=\"rounded-xl bg-navy-900 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-navy-800\"\n            >\n                Start Planning\n            <\/a>\n\n        <\/div>\n\n\n        <button\n            id=\"menuButton\"\n            type=\"button\"\n            class=\"rounded-lg p-2 text-navy-900 lg:hidden\"\n            aria-label=\"Open navigation menu\"\n            aria-expanded=\"false\"\n        >\n\n            <svg\n                class=\"h-6 w-6\"\n                fill=\"none\"\n                stroke=\"currentColor\"\n                viewBox=\"0 0 24 24\"\n            >\n\n                <path\n                    stroke-linecap=\"round\"\n                    stroke-linejoin=\"round\"\n                    stroke-width=\"2\"\n                    d=\"M4 6h16M4 12h16M4 18h16\"\n                />\n\n            <\/svg>\n\n        <\/button>\n\n    <\/div>\n\n\n    <div\n        id=\"mobileMenu\"\n        class=\"mobile-menu hidden border-t border-slate-200 bg-white lg:hidden\"\n    >\n\n        <nav class=\"mx-auto max-w-[1200px] px-5 py-5\">\n\n            <div class=\"flex flex-col gap-1\">\n\n                <a\n                    href=\"plan.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Plan\n                <\/a>\n\n                <a\n                    href=\"invest.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Invest\n                <\/a>\n\n                <a\n                    href=\"protect.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Protect\n                <\/a>\n\n                <a\n                    href=\"decide.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Decide\n                <\/a>\n\n                <a\n                    href=\"learn.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Learn\n                <\/a>\n\n                <a\n                    href=\"about.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    About\n                <\/a>\n\n\n                <div class=\"mt-3 grid grid-cols-2 gap-3 border-t border-slate-100 pt-4\">\n\n                    <a\n                        href=\"login.html\"\n                        class=\"rounded-xl border border-slate-200 px-4 py-3 text-center text-sm font-semibold text-navy-900\"\n                    >\n                        Login\n                    <\/a>\n\n                    <a\n                        href=\"login.html\"\n                        class=\"rounded-xl bg-navy-900 px-4 py-3 text-center text-sm font-semibold text-white\"\n                    >\n                        Start Planning\n                    <\/a>\n\n                <\/div>\n\n            <\/div>\n\n        <\/nav>\n\n    <\/div>\n\n<\/header>\n\n\n<main>\n\n\n<!-- =========================================================\n     HERO\n========================================================= -->\n\n<section class=\"hero-grid relative overflow-hidden pt-32 lg:pt-40\">\n\n    <div class=\"absolute inset-x-0 top-0 -z-10 h-[480px] bg-gradient-to-b from-teal-50/80 to-transparent\"><\/div>\n\n\n    <div class=\"mx-auto max-w-[1200px] px-5 pb-20 lg:px-8 lg:pb-24\">\n\n        <div class=\"mx-auto max-w-4xl text-center\">\n\n\n            <div class=\"mb-6 inline-flex items-center gap-2 rounded-full border border-teal-100 bg-teal-50 px-3.5 py-2\">\n\n                <span class=\"h-2 w-2 rounded-full bg-teal-600\"><\/span>\n\n                <span class=\"text-xs font-semibold tracking-wide text-teal-700\">\n                    Legal\n                <\/span>\n\n            <\/div>\n\n\n            <h1 class=\"text-5xl font-extrabold leading-[1.06] tracking-[-0.04em] text-navy-900 sm:text-6xl\">\n                Privacy Policy\n            <\/h1>\n\n\n            <p class=\"mx-auto mt-6 max-w-2xl text-lg leading-8 text-slate-600\">\n                How Planvesto handles information provided through its website\n                and platform.\n            <\/p>\n\n\n            <p class=\"mt-5 text-sm font-medium text-slate-400\">\n                Last updated: August 30, 2026\n            <\/p>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     CONTENT\n========================================================= -->\n\n<section class=\"pb-24 lg:pb-32\">\n\n    <div class=\"mx-auto max-w-[1000px] px-5 lg:px-8\">\n\n\n        <div class=\"rounded-[28px] border border-slate-200 bg-white p-7 shadow-sm sm:p-10 lg:p-14\">\n\n\n            <!-- Introduction -->\n\n            <section>\n\n                <h2 class=\"text-2xl font-extrabold tracking-tight text-navy-900\">\n                    1. Introduction\n                <\/h2>\n\n\n                <p class=\"mt-5 text-sm leading-7 text-slate-600\">\n                    Planvesto respects the privacy of individuals who use its\n                    website, applications and financial planning services.\n                    This Privacy Policy explains the general categories of\n                    information that may be collected, how that information\n                    may be used and the choices available to users.\n                <\/p>\n\n\n                <p class=\"mt-4 text-sm leading-7 text-slate-600\">\n                    By using the Planvesto website or platform, you acknowledge\n                    that information may be handled as described in this policy.\n                <\/p>\n\n            <\/section>\n\n\n            <div class=\"my-10 h-px bg-slate-200\"><\/div>\n\n\n            <!-- Information collected -->\n\n            <section>\n\n                <h2 class=\"text-2xl font-extrabold tracking-tight text-navy-900\">\n                    2. Information we may collect\n                <\/h2>\n\n\n                <p class=\"mt-5 text-sm leading-7 text-slate-600\">\n                    Depending on how you use Planvesto, information may include:\n                <\/p>\n\n\n                <ul class=\"mt-5 space-y-3 text-sm leading-7 text-slate-600\">\n\n                    <li class=\"flex gap-3\">\n\n                        <span class=\"mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-teal-600\"><\/span>\n\n                        <span>\n                            Basic identification and contact information,\n                            such as name and email address.\n                        <\/span>\n\n                    <\/li>\n\n\n                    <li class=\"flex gap-3\">\n\n                        <span class=\"mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-teal-600\"><\/span>\n\n                        <span>\n                            Information that you provide while using financial\n                            planning features.\n                        <\/span>\n\n                    <\/li>\n\n\n                    <li class=\"flex gap-3\">\n\n                        <span class=\"mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-teal-600\"><\/span>\n\n                        <span>\n                            Information about your goals, preferences,\n                            financial position or other information that you\n                            voluntarily provide for planning purposes.\n                        <\/span>\n\n                    <\/li>\n\n\n                    <li class=\"flex gap-3\">\n\n                        <span class=\"mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-teal-600\"><\/span>\n\n                        <span>\n                            Technical information associated with your use of\n                            the website or platform.\n                        <\/span>\n\n                    <\/li>\n\n                <\/ul>\n\n            <\/section>\n\n\n            <div class=\"my-10 h-px bg-slate-200\"><\/div>\n\n\n            <!-- Use -->\n\n            <section>\n\n                <h2 class=\"text-2xl font-extrabold tracking-tight text-navy-900\">\n                    3. How information may be used\n                <\/h2>\n\n\n                <p class=\"mt-5 text-sm leading-7 text-slate-600\">\n                    Information may be used to provide, operate and improve\n                    Planvesto's services and user experience.\n                <\/p>\n\n\n                <ul class=\"mt-5 space-y-3 text-sm leading-7 text-slate-600\">\n\n                    <li class=\"flex gap-3\">\n\n                        <span class=\"mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-teal-600\"><\/span>\n\n                        <span>\n                            To create and maintain your account.\n                        <\/span>\n\n                    <\/li>\n\n\n                    <li class=\"flex gap-3\">\n\n                        <span class=\"mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-teal-600\"><\/span>\n\n                        <span>\n                            To provide financial planning and related platform functionality.\n                        <\/span>\n\n                    <\/li>\n\n\n                    <li class=\"flex gap-3\">\n\n                        <span class=\"mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-teal-600\"><\/span>\n\n                        <span>\n                            To communicate with you regarding your account,\n                            enquiries or requested services.\n                        <\/span>\n\n                    <\/li>\n\n\n                    <li class=\"flex gap-3\">\n\n                        <span class=\"mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-teal-600\"><\/span>\n\n                        <span>\n                            To maintain security, prevent misuse and protect\n                            the integrity of the platform.\n                        <\/span>\n\n                    <\/li>\n\n\n                    <li class=\"flex gap-3\">\n\n                        <span class=\"mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-teal-600\"><\/span>\n\n                        <span>\n                            To improve the website, platform and services.\n                        <\/span>\n\n                    <\/li>\n\n                <\/ul>\n\n            <\/section>\n\n\n            <div class=\"my-10 h-px bg-slate-200\"><\/div>\n\n\n            <!-- Financial information -->\n\n            <section>\n\n                <h2 class=\"text-2xl font-extrabold tracking-tight text-navy-900\">\n                    4. Financial information\n                <\/h2>\n\n\n                <p class=\"mt-5 text-sm leading-7 text-slate-600\">\n                    Financial planning may require users to provide information\n                    about income, expenses, assets, liabilities, investments,\n                    goals, protection needs and other relevant circumstances.\n                <\/p>\n\n\n                <p class=\"mt-4 text-sm leading-7 text-slate-600\">\n                    Such information is used in connection with the financial\n                    planning experience and related services for which it was\n                    provided.\n                <\/p>\n\n\n                <div class=\"mt-6 rounded-2xl border border-teal-100 bg-teal-50 p-5\">\n\n                    <p class=\"text-sm leading-7 text-slate-600\">\n                        Users should provide only information that is reasonably\n                        necessary for the intended financial planning purpose\n                        and should keep account information accurate and current.\n                    <\/p>\n\n                <\/div>\n\n            <\/section>\n\n\n            <div class=\"my-10 h-px bg-slate-200\"><\/div>\n\n\n            <!-- Sharing -->\n\n            <section>\n\n                <h2 class=\"text-2xl font-extrabold tracking-tight text-navy-900\">\n                    5. Information sharing\n                <\/h2>\n\n\n                <p class=\"mt-5 text-sm leading-7 text-slate-600\">\n                    Planvesto does not treat user information as public\n                    information. Information may be shared with service\n                    providers or other parties where necessary to operate\n                    the platform, provide requested services, maintain\n                    security, comply with applicable law or fulfil another\n                    legitimate purpose.\n                <\/p>\n\n\n                <p class=\"mt-4 text-sm leading-7 text-slate-600\">\n                    Where third-party service providers are used, access to\n                    information should be limited to what is reasonably\n                    necessary for the relevant service.\n                <\/p>\n\n            <\/section>\n\n\n            <div class=\"my-10 h-px bg-slate-200\"><\/div>\n\n\n            <!-- Security -->\n\n            <section>\n\n                <h2 class=\"text-2xl font-extrabold tracking-tight text-navy-900\">\n                    6. Data security\n                <\/h2>\n\n\n                <p class=\"mt-5 text-sm leading-7 text-slate-600\">\n                    Planvesto is intended to use reasonable technical and\n                    organisational measures to protect information against\n                    unauthorised access, misuse, alteration or disclosure.\n                <\/p>\n\n\n                <p class=\"mt-4 text-sm leading-7 text-slate-600\">\n                    No internet-based system can guarantee absolute security.\n                    Users should also take reasonable steps to protect their\n                    passwords, devices and account credentials.\n                <\/p>\n\n            <\/section>\n\n\n            <div class=\"my-10 h-px bg-slate-200\"><\/div>\n\n\n            <!-- Cookies -->\n\n            <section>\n\n                <h2 class=\"text-2xl font-extrabold tracking-tight text-navy-900\">\n                    7. Cookies and technical information\n                <\/h2>\n\n\n                <p class=\"mt-5 text-sm leading-7 text-slate-600\">\n                    Planvesto may use cookies, local storage or similar\n                    technologies where necessary to operate the website,\n                    remember preferences, understand usage and improve the\n                    user experience.\n                <\/p>\n\n\n                <p class=\"mt-4 text-sm leading-7 text-slate-600\">\n                    Browser settings may allow you to control certain cookies.\n                    Disabling some technologies may affect website functionality.\n                <\/p>\n\n            <\/section>\n\n\n            <div class=\"my-10 h-px bg-slate-200\"><\/div>\n\n\n            <!-- Retention -->\n\n            <section>\n\n                <h2 class=\"text-2xl font-extrabold tracking-tight text-navy-900\">\n                    8. Data retention\n                <\/h2>\n\n\n                <p class=\"mt-5 text-sm leading-7 text-slate-600\">\n                    Information may be retained for as long as reasonably\n                    necessary for the purposes for which it was collected,\n                    including account management, service delivery,\n                    security, legal obligations and legitimate business purposes.\n                <\/p>\n\n            <\/section>\n\n\n            <div class=\"my-10 h-px bg-slate-200\"><\/div>\n\n\n            <!-- User rights -->\n\n            <section>\n\n                <h2 class=\"text-2xl font-extrabold tracking-tight text-navy-900\">\n                    9. Your choices and rights\n                <\/h2>\n\n\n                <p class=\"mt-5 text-sm leading-7 text-slate-600\">\n                    Depending on applicable law, you may have rights relating\n                    to your personal information, including rights to request\n nter sm:justify-between\">\n\n\n            <p class=\"text-xs text-slate-400\">\n                © <span id=\"currentYear\"><\/span> Planvesto. All rights reserved.\n            <\/p>\n\n\n            <div class=\"flex flex-wrap gap-5 text-xs text-slate-400\">\n\n                <a\n                    href=\"privacy.html\"\n                    class=\"transition hover:text-navy-900\"\n                >\n                    Privacy Policy\n                <\/a>\n\n                <a\n                    href=\"terms.html\"\n                    class=\"transition hover:text-navy-900\"\n                >\n                    Terms & Conditions\n                <\/a>\n\n                <a\n                    href=\"disclaimer.html\"\n                    class=\"font-semibold text-navy-900\"\n                >\n                    Disclaimer\n                <\/a>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/footer>\n\n\n<!-- =========================================================\n     JAVASCRIPT\n========================================================= -->\n\n<script>\n\n    document.addEventListener('DOMContentLoaded', function () {\n\n        const menuButton =\n            document.getElementById('menuButton');\n\n        const mobileMenu =\n            document.getElementById('mobileMenu');\n\n        const currentYear =\n            document.getElementById('currentYear');\n\n\n        /* Current year */\n\n        if (currentYear) {\n\n            currentYear.textContent =\n                new Date().getFullYear();\n\n        }\n\n\n        /* Mobile navigation */\n\n        if (menuButton && mobileMenu) {\n\n            menuButton.addEventListener('click', function () {\n\n                const isHidden =\n                    mobileMenu.classList.contains('hidden');\n\n                mobileMenu.classList.toggle('hidden');\n\n                menuButton.setAttribute(\n                    'aria-expanded',\n                    String(isHidden)\n                );\n\n            });\n\n\n            mobileMenu\n                .querySelectorAll('a')\n                .forEach(function (link) {\n\n                    link.addEventListener('click', function () {\n\n                        mobileMenu.classList.add('hidden');\n\n                        menuButton.setAttribute(\n                            'aria-expanded',\n                            'false'\n                        );\n\n                    });\n\n                });\n\n        }\n\n    });\n\n<\/script>\n\n\n<\/body>\n<\/html>",

1.87-.34 1.7 1.7 0 00-1.04 1.56V20h-2.4v-.21a1.7 1.7 0 00-1.04-1.56 1.7 1.7 0 00-1.87.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 008.46 15a1.7 1.7 0 00-1.56-1.04H6.7v-2.4h.2A1.7 1.7 0 008.46 10a1.7 1.7 0 00-.34-1.87l-.06-.06 1.7-1.7.06.06a1.7 1.7 0 001.87.34 1.7 1.7 0 001.04-1.56V5h2.4v.21a1.7 1.7 0 001.04 1.56 1.7 1.7 0 001.87-.34l.06-.06 1.7 1.7-.06.06a1.7 1.7 0 00-.34 1.87 1.7 1.7 0 001.56 1.04h.21v2.4h-.21A1.7 1.7 0 0019.4 15z\"\n                            stroke-width=\"1.5\"\n                            stroke-linejoin=\"round\"\n                        />\n\n                    <\/svg>\n\n                <\/div>\n\n\n                <h1 class=\"mt-6 text-3xl font-extrabold tracking-tight text-navy-900 sm:text-4xl\">\n                    Welcome back\n                <\/h1>\n\n\n                <p class=\"mt-3 text-sm leading-6 text-slate-500\">\n                    Login to continue your financial planning journey.\n                <\/p>\n\n            <\/div>\n\n\n            <!-- Login Card -->\n\n            <div class=\"login-card rounded-[28px] border border-slate-200 bg-white p-6 shadow-soft sm:p-8\">\n\n\n                <!-- Form -->\n\n                <form\n                    id=\"loginForm\"\n                    novalidate\n                    class=\"space-y-5\"\n                >\n\n\n                    <!-- Email -->\n\n                    <div>\n\n                        <label\n                            for=\"email\"\n                            class=\"mb-2 block text-sm font-semibold text-navy-900\"\n                        >\n                            Email address\n                        <\/label>\n\n\n                        <input\n                            id=\"email\"\n                            name=\"email\"\n                            type=\"email\"\n                            autocomplete=\"email\"\n                            required\n                            class=\"form-field w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 text-sm text-navy-900 placeholder:text-slate-400\"\n                            placeholder=\"you@example.com\"\n                        />\n\n\n                        <p\n                            id=\"emailError\"\n                            class=\"mt-2 hidden text-xs font-medium text-red-600\"\n                        >\n                            Enter a valid email address.\n                        <\/p>\n\n                    <\/div>\n\n\n                    <!-- Password -->\n\n                    <div>\n\n                        <div class=\"mb-2 flex items-center justify-between\">\n\n                            <label\n                                for=\"password\"\n                                class=\"block text-sm font-semibold text-navy-900\"\n                            >\n                                Password\n                            <\/label>\n\n\n                            <button\n                                type=\"button\"\n                                id=\"forgotPassword\"\n                                class=\"text-xs font-semibold text-teal-700 transition hover:text-navy-900\"\n                            >\n                                Forgot password?\n                            <\/button>\n\n                        <\/div>\n\n\n                        <div class=\"relative\">\n\n                            <input\n                                id=\"password\"\n                                name=\"password\"\n                                type=\"password\"\n                                autocomplete=\"current-password\"\n                                required\n                                minlength=\"6\"\n                                class=\"form-field w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 pr-12 text-sm text-navy-900 placeholder:text-slate-400\"\n                                placeholder=\"Enter your password\"\n                            />\n\n\n                            <button\n                                type=\"button\"\n                                id=\"togglePassword\"\n                                class=\"password-toggle absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-400\"\n                                aria-label=\"Show password\"\n                            >\n\n                                <svg\n                                    id=\"eyeIcon\"\n                                    class=\"h-5 w-5\"\n                                    fill=\"none\"\n                                    stroke=\"currentColor\"\n                                    viewBox=\"0 0 24 24\"\n                                >\n\n                                    <path\n                                        d=\"M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z\"\n                                        stroke-width=\"1.7\"\n                                        stroke-linejoin=\"round\"\n                                    />\n\n                                    <circle\n                                        cx=\"12\"\n                                        cy=\"12\"\n                                        r=\"2.5\"\n                                        stroke-width=\"1.7\"\n                                    />\n\n                                <\/svg>\n\n                            <\/button>\n\n                        <\/div>\n\n\n                        <p\n                            id=\"passwordError\"\n                            class=\"mt-2 hidden text-xs font-medium text-red-600\"\n                        >\n                            Enter your password.\n                        <\/p>\n\n                    <\/div>\n\n\n                    <!-- Remember -->\n\n                    <div class=\"flex items-center gap-3\">\n\n                        <input\n                            id=\"remember\"\n                            name=\"remember\"\n                            type=\"checkbox\"\n                            class=\"h-4 w-4 rounded border-slate-300 text-teal-600 focus:ring-teal-500\"\n                        />\n\n\n                        <label\n                            for=\"remember\"\n                            class=\"text-sm text-slate-500\"\n                        >\n                            Remember me\n                        <\/label>\n\n                    <\/div>\n\n\n                    <!-- Submit -->\n\n                    <button\n                        id=\"loginButton\"\n                        type=\"submit\"\n                        class=\"flex w-full items-center justify-center gap-2 rounded-xl bg-navy-900 px-6 py-3.5 text-sm font-bold text-white transition hover:bg-navy-800 disabled:cursor-not-allowed disabled:opacity-60\"\n                    >\n                        Login\n                        <span>→<\/span>\n                    <\/button>\n\n\n                    <!-- Demo state -->\n\n                    <div\n                        id=\"loginMessage\"\n                        class=\"hidden rounded-xl border border-teal-100 bg-teal-50 p-4\"\n                    >\n\n                        <p\n                            id=\"loginMessageTitle\"\n                            class=\"text-sm font-bold text-teal-700\"\n                        >\n                            Login submitted.\n                        <\/p>\n\n\n                        <p\n                            id=\"loginMessageText\"\n                            class=\"mt-1 text-xs leading-5 text-slate-600\"\n                        >\n                            Connect this form to the authentication service\n                            to complete account login.\n                        <\/p>\n\n                    <\/div>\n\n                <\/form>\n\n\n                <!-- Divider -->\n\n                <div class=\"my-7 flex items-center gap-4\">\n\n                    <div class=\"h-px flex-1 bg-slate-200\"><\/div>\n\n                    <span class=\"text-xs font-medium text-slate-400\">\n                        OR\n                    <\/span>\n\n                    <div class=\"h-px flex-1 bg-slate-200\"><\/div>\n\n                <\/div>\n\n\n                <!-- Create account -->\n\n                <a\n                    href=\"signup.html\"\n                    class=\"flex w-full items-center justify-center rounded-xl border border-slate-200 px-6 py-3.5 text-sm font-bold text-navy-900 transition hover:bg-slate-50\"\n                >\n                    Create an account\n                <\/a>\n\n\n            <\/div>\n\n\n            <!-- Bottom text -->\n\n            <p class=\"mt-6 text-center text-xs leading-5 text-slate-400\">\n\n                By continuing, you agree to Planvesto's\n\n                <a\n                    href=\"terms.html\"\n                    class=\"font-semibold text-slate-600 hover:text-navy-900\"\n                >\n                    Terms & Conditions\n                <\/a>\n\n                and\n\n                <a\n                    href=\"privacy.html\"\n                    class=\"font-semibold text-slate-600 hover:text-navy-900\"\n                >\n                    Privacy Policy\n                <\/a>.\n\n            <\/p>\n\n        <\/div>\n\n    <\/div>\n\n<\/main>\n\n\n<!-- =========================================================\n     JAVASCRIPT\n========================================================= -->\n\n<script>\n\n    document.addEventListener('DOMContentLoaded', function () {\n\n\n        const loginForm =\n            document.getElementById('loginForm');\n\n        const email =\n            document.getElementById('email');\n\n        const password =\n            document.getElementById('password');\n\n        const remember =\n            document.getElementById('remember');\n\n        const emailError =\n            document.getElementById('emailError');\n\n        const passwordError =\n            document.getElementById('passwordError');\n\n        const loginButton =\n            document.getElementById('loginButton');\n\n        const loginMessage =\n            document.getElementById('loginMessage');\n\n        const loginMessageTitle =\n            document.getElementById('loginMessageTitle');\n\n        const loginMessageText =\n            document.getElementById('loginMessageText');\n\n        const togglePassword =\n            document.getElementById('togglePassword');\n\n        const forgotPassword =\n            document.getElementById('forgotPassword');\n\n\n        /* -----------------------------------------------------\n           Password visibility\n        ----------------------------------------------------- */\n\n        if (togglePassword) {\n\n            togglePassword.addEventListener('click', function () {\n\n                const isPassword =\n                    password.type === 'password';\n\n                password.type =\n                    isPassword ? 'text' : 'password';\n\n\n                togglePassword.setAttribute(\n                    'aria-label',\n                    isPassword\n                        ? 'Hide password'\n                        : 'Show password'\n                );\n\n            });\n\n        }\n\n\n        /* -----------------------------------------------------\n           Forgot password\n        ----------------------------------------------------- */\n\n        if (forgotPassword) {\n\n            forgotPassword.addEventListener('click', function () {\n\n                const enteredEmail =\n                    email.value.trim();\n\n\n                loginMessage.classList.remove('hidden');\n\n\n                if (enteredEmail) {\n\n                    loginMessageTitle.textContent =\n                        'Password reset requested.';\n\n                    loginMessageText.textContent =\n                        'Connect this action to the authentication service to send a password reset email.';\n\n                } else {\n\n                    loginMessageTitle.textContent =\n                        'Enter your email first.';\n\n                    loginMessageText.textContent =\n                        'Enter the email associated with your Planvesto account and then request a password reset.';\n\n                }\n\n            });\n\n        }\n\n\n        /* -----------------------------------------------------\n           Login validation\n        ----------------------------------------------------- */\n\n        if (loginForm) {\n\n            loginForm.addEventListener('submit', function (event) {\n\n                event.preventDefault();\n\n\n                const emailValue =\n                    email.value.trim();\n\n                const passwordValue =\n                    password.value;\n\n\n                let valid = true;\n\n\n                emailError.classList.add('hidden');\n\n                passwordError.classList.add('hidden');\n\n                loginMessage.classList.add('hidden');\n\n\n                email.classList.remove(\n                    'border-red-400'\n                );\n\n                password.classList.remove(\n                    'border-red-400'\n                );\n\n\n                const emailPattern =\n                    /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n\n\n                if (\n                    !emailValue ||\n                    !emailPattern.test(emailValue)\n                ) {\n\n                    emailError.classList.remove('hidden');\n\n                    email.classList.add(\n                        'border-red-400'\n                    );\n\n                    valid = false;\n\n                }\n\n\n                if (!passwordValue) {\n\n                    passwordError.textContent =\n                        'Enter your password.';\n\n                    passwordError.classList.remove(\n                        'hidden'\n                    );\n\n                    password.classList.add(\n                        'border-red-400'\n                    );\n\n                    valid = false;\n\n                } else if (passwordValue.length < 6) {\n\n                    passwordError.textContent =\n                        'Password must contain at least 6 characters.';\n\n                    passwordError.classList.remove(\n                        'hidden'\n                    );\n\n                    password.classList.add(\n                        'border-red-400'\n                    );\n\n                    valid = false;\n\n                }\n\n\n                if (!valid) {\n\n                    return;\n\n                }\n\n\n                /*\n                    Frontend-only authentication state.\n\n                    Replace this section with the actual\n                    Planvesto authentication API / Supabase\n                    authentication call when connected.\n                */\n\n                loginButton.disabled = true;\n\n                loginButton.innerHTML =\n                    'Signing in…';\n\n\n                window.setTimeout(function () {\n\n                    loginButton.disabled = false;\n\n                    loginButton.innerHTML =\n                        'Login <span>→<\/span>';\n\n\n                    loginMessage.classList.remove(\n                        'hidden'\n                    );\n\n\n                    loginMessageTitle.textContent =\n                        'Login form validated.';\n\n\n                    loginMessageText.textContent =\n                        remember.checked\n                            ? 'Your credentials are ready to be sent to the authentication service.'\n                            : 'Your credentials are ready to be sent to the authentication service.';\n\n\n                }, 500);\n\n            });\n\n        }\n\n    });\n\n<\/script>\n\n\n<\/body>\n<\/html>",

div class=\"relative\">\n\n                            <input\n                                id=\"password\"\n                                name=\"password\"\n                                type=\"password\"\n                                autocomplete=\"new-password\"\n                                required\n                                minlength=\"8\"\n                                class=\"form-field w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 pr-12 text-sm text-navy-900 placeholder:text-slate-400\"\n                                placeholder=\"At least 8 characters\"\n                            />\n\n\n                            <button\n                                id=\"togglePassword\"\n                                type=\"button\"\n                                class=\"absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-400 transition hover:text-navy-900\"\n                                aria-label=\"Show password\"\n                            >\n\n                                <svg\n                                    class=\"h-5 w-5\"\n                                    fill=\"none\"\n                                    stroke=\"currentColor\"\n                                    viewBox=\"0 0 24 24\"\n                                >\n\n                                    <path\n                                        d=\"M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z\"\n                                        stroke-width=\"1.7\"\n                                        stroke-linejoin=\"round\"\n                                    />\n\n                                    <circle\n                                        cx=\"12\"\n                                        cy=\"12\"\n                                        r=\"2.5\"\n                                        stroke-width=\"1.7\"\n                                    />\n\n                                <\/svg>\n\n                            <\/button>\n\n                        <\/div>\n\n\n                        <!-- Strength -->\n\n                        <div class=\"mt-3\">\n\n                            <div class=\"h-1.5 overflow-hidden rounded-full bg-slate-100\">\n\n                                <div\n                                    id=\"strengthBar\"\n                                    class=\"password-strength-bar h-full w-0 rounded-full\"\n                                ><\/div>\n\n                            <\/div>\n\n\n                            <p\n                                id=\"strengthText\"\n                                class=\"mt-2 text-xs text-slate-400\"\n                            >\n                                Use at least 8 characters.\n                            <\/p>\n\n                        <\/div>\n\n\n                        <p\n                            id=\"passwordError\"\n                            class=\"mt-2 hidden text-xs font-medium text-red-600\"\n                        >\n                            Password must contain at least 8 characters.\n                        <\/p>\n\n                    <\/div>\n\n\n                    <!-- Confirm password -->\n\n                    <div>\n\n                        <label\n                            for=\"confirmPassword\"\n                            class=\"mb-2 block text-sm font-semibold text-navy-900\"\n                        >\n                            Confirm password\n                        <\/label>\n\n\n                        <input\n                            id=\"confirmPassword\"\n                            name=\"confirmPassword\"\n                            type=\"password\"\n                            autocomplete=\"new-password\"\n                            required\n                            class=\"form-field w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 text-sm text-navy-900 placeholder:text-slate-400\"\n                    <\/p>\n\n\n                    <!-- Submit -->\n\n                    <button\n                        id=\"createButton\"\n                        type=\"submit\"\n                        class=\"flex w-full items-center justify-center gap-2 rounded-xl bg-navy-900 px-6 py-3.5 text-sm font-bold text-white transition hover:bg-navy-800 disabled:cursor-not-allowed disabled:opacity-60\"\n                    >\n                        Create Account\n                        <span>→<\/span>\n                    <\/button>\n\n\n                    <!-- Success -->\n\n                    <div\n                        id=\"successMessage\"\n                        class=\"hidden rounded-xl border border-teal-100 bg-teal-50 p-4\"\n                    >\n\n                        <p class=\"text-sm font-bold text-teal-700\">\n                            Account form validated.\n                        <\/p>\n\n\n                        <p class=\"mt-1 text-xs leading-5 text-slate-600\">\n                            Connect this form to the Planvesto authentication\n                            service to create the account.\n                        <\/p>\n\n                    <\/div>\n\n                <\/form>\n\n\n                <!-- Existing account -->\n\n                <div class=\"mt-7 border-t border-slate-100 pt-6 text-center\">\n\n                    <p class=\"text-sm text-slate-500\">\n\n                        Already have an account?\n\n                        <a\n                            href=\"login.html\"\n                            class=\"font-bold text-navy-900 hover:text-teal-700\"\n                        >\n                            Login\n                        <\/a>\n\n                    <\/p>\n\n                <\/div>\n\n\n            <\/div>\n\n\n            <p class=\"mt-6 text-center text-xs leading-5 text-slate-400\">\n                Your information is handled according to the\n                <a\n                    href=\"privacy.html\"\n                    class=\"font-semibold text-slate-600 hover:text-navy-900\"\n                >\n                    Planvesto Privacy Policy\n                <\/a>.\n            <\/p>\n\n        <\/div>\n\n    <\/div>\n\n<\/main>\n\n\n<!-- =========================================================\n     JAVASCRIPT\n========================================================= -->\n\n<script>\n\n    document.addEventListener('DOMContentLoaded', function () {\n\n\n        const signupForm =\n            document.getElementById('signupForm');\n\n        const fullName =\n            document.getElementById('fullName');\n\n        const email =\n            document.getElementById('email');\n\n        const password =\n            document.getElementById('password');\n\n        const confirmPassword =\n            document.getElementById('confirmPassword');\n\n        const terms =\n            document.getElementById('terms');\n\n        const createButton =\n            document.getElementById('createButton');\n\n        const togglePassword =\n            document.getElementById('togglePassword');\n\n        const strengthBar =\n            document.getElementById('strengthBar');\n\n        const strengthText =\n            document.getElementById('strengthText');\n\n        const successMessage =\n            document.getElementById('successMessage');\n\n\n        const nameError =\n            document.getElementById('nameError');\n\n        const emailError =\n            document.getElementById('emailError');\n\n        const passwordError =\n            document.getElementById('passwordError');\n\n        const confirmError =\n            document.getElementById('confirmError');\n\n        const termsError =\n            document.getElementById('termsError');\n\n\n        /* -----------------------------------------------------\n           Password visibility\n        ----------------------------------------------------- */\n\n        if (togglePassword) {\n\n            togglePassword.addEventListener('click', function () {\n\n                const isPassword =\n                    password.type === 'password';\n\n                password.type =\n                    isPassword ? 'text' : 'password';\n\n                togglePassword.setAttribute(\n                    'aria-label',\n                    isPassword\n                        ? 'Hide password'\n                        : 'Show password'\n                );\n\n            });\n\n        }\n\n\n        /* -----------------------------------------------------\n           Password strength\n        ----------------------------------------------------- */\n\n        if (password) {\n\n            password.addEventListener('input', function () {\n\n                const value =\n                    password.value;\n\n                let score = 0;\n\n\n                if (value.length >= 8) {\n                    score++;\n                }\n\n                if (/[A-Z]/.test(value)) {\n                    score++;\n                }\n\n                if (/[0-9]/.test(value)) {\n                    score++;\n                }\n\n                if (/[^A-Za-z0-9]/.test(value)) {\n                    score++;\n                }\n\n\n                const widths = [\n                    '0%',\n                    '25%',\n                    '50%',\n                    '75%',\n                    '100%'\n                ];\n\n\n                strengthBar.style.width =\n                    widths[score];\n\n\n                if (!value) {\n\n                    strengthText.textContent =\n                        'Use at least 8 characters.';\n\n                } else if (score === 1) {\n\n                    strengthText.textContent =\n                        'Weak password.';\n\n                } else if (score === 2) {\n\n                    strengthText.textContent =\n                        'Fair password.';\n\n                } else if (score === 3) {\n\n                    strengthText.textContent =\n                        'Good password.';\n\n                } else {\n\n                    strengthText.textContent =\n                        'Strong password.';\n\n                }\n\n            });\n\n        }\n\n\n        /* -----------------------------------------------------\n           Form submission\n        ----------------------------------------------------- */\n\n        if (signupForm) {\n\n            signupForm.addEventListener('submit', function (event) {\n\n                event.preventDefault();\n\n\n                const nameValue =\n                    fullName.value.trim();\n\n                const emailValue =\n                    email.value.trim();\n\n                const passwordValue =\n                    password.value;\n\n                const confirmValue =\n                    confirmPassword.value;\n\n\n                let valid = true;\n\n\n                /* Reset errors */\n\n                [\n                    nameError,\n                    emailError,\n                    passwordError,\n                    confirmError,\n                    termsError\n                ].forEach(function (element) {\n\n                    element.classList.add('hidden');\n\n                });\n\n\n                [\n                    fullName,\n                    email,\n                    password,\n                    confirmPassword\n                ].forEach(function (element) {\n\n                    element.classList.remove(\n                        'border-red-400'\n                    );\n\n                });\n\n\n                successMessage.classList.add(\n                    'hidden'\n                );\n\n\n                /* Name */\n\n                if (nameValue.length < 2) {\n\n                    nameError.classList.remove(\n                        'hidden'\n                    );\n\n                    fullName.classList.add(\n                        'border-red-400'\n                    );\n\n                    valid = false;\n\n                }\n\n\n                /* Email */\n\n                const emailPattern =\n                    /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n\n\n                if (\n                    !emailValue ||\n                    !emailPattern.test(emailValue)\n                ) {\n\n                    emailError.classList.remove(\n                        'hidden'\n                    );\n\n                    email.classList.add(\n                        'border-red-400'\n                    );\n\n                    valid = false;\n\n                }\n\n\n                /* Password */\n\n                if (passwordValue.length < 8) {\n\n                    passwordError.classList.remove(\n                        'hidden'\n                    );\n\n                    password.classList.add(\n                        'border-red-400'\n                    );\n\n                    valid = false;\n\n                }\n\n\n                /* Confirm */\n\n                if (\n                    !confirmValue ||\n                    confirmValue !== passwordValue\n                ) {\n\n                    confirmError.classList.remove(\n                        'hidden'\n                    );\n\n                    confirmPassword.classList.add(\n                        'border-red-400'\n                    );\n\n                    valid = false;\n\n                }\n\n\n                /* Terms */\n\n                if (!terms.checked) {\n\n                    termsError.classList.remove(\n                        'hidden'\n                    );\n\n                    valid = false;\n\n                }\n\n\n                if (!valid) {\n\n                    return;\n\n                }\n\n\n                /*\n                    Frontend-only account creation state.\n\n                    Replace this section with the actual\n                    authentication API / Supabase Auth\n                    implementation when the backend is connected.\n                */\n\n                createButton.disabled = true;\n\n                createButton.innerHTML =\n                    'Creating Account…';\n\n\n                window.setTimeout(function () {\n\n                    createButton.disabled = false;\n\n                    createButton.innerHTML =\n                        'Create Account <span>→<\/span>';\n\n\n                    successMessage.classList.remove(\n                        'hidden'\n                    );\n\n\n                    successMessage.scrollIntoView({\n                        behavior: 'smooth',\n                        block: 'nearest'\n                    });\n\n\n                }, 600);\n\n            });\n\n        }\n\n    });\n\n<\/script>\n\n\n<\/body>\n<\/html>"

const PAGE_ALIASES = {
    "index.html": "index.html",
    "plan.html": "login.html",
    "invest.html": "invest.html",
    "protect.html": "protect.html",
    "decide.html": "decide.html",
    "learn.html": "learn.html",
    "about.html": "about.html",
    "contact.html": "contact.html",
    "privacy.html": "privacy.html",
    "terms.html": "terms.html",
    "disclaimer.html": "disclaimer.html",
    "login.html": "login.html",
    "signup.html": "signup.html"
};

const frame = document.getElementById("planvesto-page-frame");

let currentPage = "index.html";
let currentHash = "";

function normalisePageTarget(url) {
    try {
        const parsed = new URL(url, window.location.href);
        const fileName = parsed.pathname.split("/").pop() || "index.html";
        const page = PAGE_ALIASES[fileName];
        if (!page) return null;

        return {
            page,
            hash: parsed.hash || ""
        };
    } catch (error) {
        return null;
    }
}

function setFrameHeight() {
    try {
        const doc = frame.contentDocument;
        if (!doc || !doc.documentElement) return;

        const bodyHeight = doc.body ? doc.body.scrollHeight : 0;
        const documentHeight = doc.documentElement.scrollHeight;
        const viewportHeight = window.innerHeight;

        frame.style.height = Math.max(
            bodyHeight,
            documentHeight,
            viewportHeight
        ) + "px";
    } catch (error) {
        frame.style.height = "100vh";
    }
}

function connectFrameNavigation() {
    try {
        const doc = frame.contentDocument;
        if (!doc) return;

        doc.addEventListener("click", function(event) {
            const link = event.target.closest("a");
            if (!link) return;

            const href = link.getAttribute("href");
            if (!href) return;

            /*
                Preserve ordinary in-page anchors exactly as the original
                document handles them.
            */
            if (href.startsWith("#")) {
                return;
            }

            const target = normalisePageTarget(link.href);
            if (!target) {
                return;
            }

            event.preventDefault();
            event.stopPropagation();

            loadPage(target.page, target.hash);
        }, true);

        /*
            Keep the iframe height aligned with the original document.
        */
        if (window.ResizeObserver) {
            const observer = new ResizeObserver(function() {
                setFrameHeight();
            });

            if (doc.body) observer.observe(doc.body);
            observer.observe(doc.documentElement);
        }

        setFrameHeight();
    } catch (error) {
        setFrameHeight();
    }
}

function loadPage(page, hash = "", pushState = true) {
    if (!PLANVESTO_PAGES[page]) {
        page = "index.html";
    }

    currentPage = page;
    currentHash = hash || "";

    frame.srcdoc = PLANVESTO_PAGES[page];

    if (pushState) {
        const newUrl =
            window.location.pathname +
            "#" +
            page.replace(".html", "") +
            (hash || "");

        history.pushState(
            {
                page,
                hash
            },
            "",
            newUrl
        );
    }
}

frame.addEventListener("load", function() {
    connectFrameNavigation();

    if (currentHash) {
        window.setTimeout(function() {
            try {
                const target = frame.contentDocument.querySelector(
                    currentHash
                );

                if (target) {
                    target.scrollIntoView();
                }
            } catch (error) {}
        }, 50);
    }
});

window.addEventListener("resize", setFrameHeight);

window.addEventListener("popstate", function(event) {
    if (event.state && event.state.page) {
        loadPage(
            event.state.page,
            event.state.hash || "",
            false
        );
        return;
    }

    const parsed = window.location.hash.replace(/^#/, "");

    if (!parsed) {
        loadPage("index.html", "", false);
        return;
    }

    const match = parsed.match(
        /^(index|invest|protect|decide|learn|about|contact|privacy|terms|disclaimer|login|signup)(.*)$/
    );

    if (!match) {
        loadPage("index.html", "", false);
        return;
