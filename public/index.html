      <\/td>\n\n                            <td class=\"px-6 py-5 text-sm text-slate-600\">\n                                Higher\n                            <\/td>\n\n                            <td class=\"px-6 py-5 text-sm text-slate-600\">\n                                Depends\n                            <\/td>\n\n                        <\/tr>\n\n\n                        <tr>\n\n                            <td class=\"px-6 py-5 text-sm font-semibold text-navy-900 sm:px-8\">\n                                Goal outcome\n                            <\/td>\n\n                            <td class=\"px-6 py-5 text-sm text-slate-600\">\n                                Potentially improved\n                            <\/td>\n\n                            <td class=\"px-6 py-5 text-sm text-slate-600\">\n                                Baseline\n                            <\/td>\n\n                            <td class=\"px-6 py-5 text-sm text-slate-600\">\n                                Depends\n                            <\/td>\n\n                        <\/tr>\n\n                    <\/tbody>\n\n                <\/table>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     DECISION PROCESS\n========================================================= -->\n\n<section\n    id=\"how-it-works\"\n    class=\"scroll-mt-32 bg-navy-900 py-24 text-white lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[0.8fr_1.2fr]\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-300\">\n                    How it works\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] sm:text-5xl\">\n                    From problem to financial decision.\n                <\/h2>\n\n                <p class=\"mt-6 max-w-lg text-base leading-7 text-slate-300\">\n                    Planvesto's decision process connects the financial problem,\n                    possible strategies and scenario outcomes before arriving\n                    at a selected financial plan.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"space-y-7\">\n\n                <div class=\"decision-line flex gap-5\">\n\n                    <div class=\"relative z-10 flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        01\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Understand the problem\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Identify the financial issue, goal or constraint that requires a decision.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"decision-line flex gap-5\">\n\n                    <div class=\"relative z-10 flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        02\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Consider applicable strategies\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Identify strategies that are relevant to the specific situation.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"decision-line flex gap-5\">\n\n                    <div class=\"relative z-10 flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        03\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Evaluate scenarios\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Compare what the different strategies could mean under the relevant assumptions.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"decision-line flex gap-5\">\n\n                    <div class=\"relative z-10 flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        04\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Compare the trade-offs\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Consider goals, risk, liquidity, cash flow and other constraints together.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"decision-line flex gap-5\">\n\n                    <div class=\"relative z-10 flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        05\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Select the financial plan\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Move from alternatives to a selected financial decision.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"flex gap-5\">\n\n                    <div class=\"relative z-10 flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-teal-600 text-sm font-bold\">\n                        06\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Understand and act\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            See why the decision was selected and what actions follow from it.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     EXPLANATION\n========================================================= -->\n\n<section class=\"py-24 lg:py-32\">\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-2 lg:items-center\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                    Explain the decision\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                    A decision should come with a reason.\n                <\/h2>\n\n                <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                    Planvesto is designed so that a financial decision can be\n                    understood in terms of the evidence, assumptions,\n                    alternatives and scenario results behind it.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-[28px] border border-slate-200 bg-white p-6 shadow-soft sm:p-8\">\n\n                <div class=\"border-b border-slate-100 pb-6\">\n\n                    <p class=\"text-xs font-bold uppercase tracking-wider text-slate-400\">\n                        Why this decision?\n                    <\/p>\n\n                    <h3 class=\"mt-2 text-xl font-bold text-navy-900\">\n                        Increase retirement funding\n                    <\/h3>\n\n                <\/div>\n\n\n                <div class=\"mt-6 space-y-5\">\n\n                    <div class=\"flex gap-4\">\n\n                        <div class=\"mt-1 h-2.5 w-2.5 shrink-0 rounded-full bg-teal-600\"><\/div>\n\n                        <div>\n\n                            <p class=\"text-sm font-bold text-navy-900\">\n                                Goal requirement\n                            <\/p>\n\n                            <p class=\"mt-1 text-sm leading-6 text-slate-500\">\n                                The projected retirement position indicates a funding requirement.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n\n                    <div class=\"flex gap-4\">\n\n                        <div class=\"mt-1 h-2.5 w-2.5 shrink-0 rounded-full bg-teal-600\"><\/div>\n\n                        <div>\n\n                            <p class=\"text-sm font-bold text-navy-900\">\n                                Strategy comparison\n                            <\/p>\n\n                            <p class=\"mt-1 text-sm leading-6 text-slate-500\">\n                                Multiple relevant strategies were considered against the stated constraints.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n\n                    <div class=\"flex gap-4\">\n\n                        <div class=\"mt-1 h-2.5 w-2.5 shrink-0 rounded-full bg-teal-600\"><\/div>\n\n                        <div>\n\n                            <p class=\"text-sm font-bold text-navy-900\">\n                                Scenario outcome\n                            <\/p>\n\n                            <p class=\"mt-1 text-sm leading-6 text-slate-500\">\n                                The selected strategy produced the preferred overall financial outcome in the example.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n\n                    <div class=\"flex gap-4\">\n\n                        <div class=\"mt-1 h-2.5 w-2.5 shrink-0 rounded-full bg-teal-600\"><\/div>\n\n                        <div>\n\n                            <p class=\"text-sm font-bold text-navy-900\">\n                                Financial constraints\n                            <\/p>\n\n                            <p class=\"mt-1 text-sm leading-6 text-slate-500\">\n                                The decision also considers the effect on cash flow and liquidity.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     DECISION ≠ PRODUCT\n========================================================= -->\n\n<section class=\"bg-white py-24 lg:py-32\">\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"mx-auto max-w-3xl text-center\">\n\n            <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                Financial decision first\n            <\/p>\n\n            <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                Decide what needs to happen before deciding what to buy.\n            <\/h2>\n\n            <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                A financial plan defines the strategy. Products are an\n                implementation layer that comes after the financial decision.\n            <\/p>\n\n        <\/div>\n\n\n        <div class=\"mx-auto mt-14 max-w-4xl\">\n\n            <div class=\"grid items-center gap-4 md:grid-cols-[1fr_auto_1fr_auto_1fr]\">\n\n                <div class=\"rounded-2xl border border-slate-200 bg-slate-50 p-6 text-center\">\n\n                    <p class=\"text-xs font-bold uppercase tracking-wider text-slate-400\">\n                        Step 1\n                    <\/p>\n\n                    <h3 class=\"mt-3 font-bold text-navy-900\">\n                        Financial problem\n                    <\/h3>\n\n                <\/div>\n\n\n                <div class=\"hidden text-2xl text-slate-300 md:block\">\n                    →\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-teal-100 bg-teal-50 p-6 text-center\">\n\n                    <p class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                        Step 2\n                    <\/p>\n\n                    <h3 class=\"mt-3 font-bold text-navy-900\">\n                        Financial strategy\n                    <\/h3>\n\n                <\/div>\n\n\n                <div class=\"hidden text-2xl text-slate-300 md:block\">\n                    →\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-slate-200 bg-slate-50 p-6 text-center\">\n\n                    <p class=\"text-xs font-bold uppercase tracking-wider text-slate-400\">\n                        Step 3\n                    <\/p>\n\n                    <h3 class=\"mt-3 font-bold text-navy-900\">\n                        Implementation\n                    <\/h3>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     ACTIONS\n========================================================= -->\n\n<section class=\"py-24 lg:py-32\">\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[0.9fr_1.1fr] lg:items-center\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-wide           <\/span>\n\n                <\/div>\n\n\n                <h3 class=\"mt-6 text-2xl font-bold tracking-tight text-navy-900\">\n                    What is financial planning?\n                <\/h3>\n\n\n                <p class=\"mt-4 text-sm leading-7 text-slate-500\">\n                    Understand how your income, expenses, assets, liabilities,\n                    goals, investments and protection fit into one financial picture.\n                <\/p>\n\n\n                <a\n                    href=\"#planning\"\n                    class=\"mt-7 inline-flex items-center gap-2 text-sm font-bold text-navy-900\"\n                >\n                    Read the basics\n                    <span>→<\/span>\n                <\/a>\n\n            <\/article>\n\n\n            <!-- Article 2 -->\n\n            <article\n                class=\"article-card article-item rounded-[24px] border border-slate-200 bg-white p-7 shadow-card\"\n                data-search=\"investing investment products asset allocation portfolio risk return\"\n            >\n\n                <div class=\"flex items-center justify-between\">\n\n                    <span class=\"rounded-lg bg-navy-900 px-2.5 py-1.5 text-xs font-bold text-white\">\n                        Investing\n                    <\/span>\n\n                    <span class=\"text-xs text-slate-400\">\n                        10 min read\n                    <\/span>\n\n                <\/div>\n\n\n                <h3 class=\"mt-6 text-2xl font-bold tracking-tight text-navy-900\">\n                    Why investment planning comes before product selection\n                <\/h3>\n\n\n                <p class=\"mt-4 text-sm leading-7 text-slate-500\">\n                    Learn why the purpose, time horizon, risk and role of an\n                    investment should be understood before choosing a product.\n                <\/p>\n\n\n                <a\n                    href=\"#investing\"\n                    cla \n\n<\/section>\n\n\n<!-- =========================================================\n     INVESTING\n========================================================= -->\n\n<section\n    id=\"investing\"\n    class=\"scroll-mt-32 py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n\n        <div class=\"max-w-3xl\">\n\n            <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                Investing\n            <\/p>\n\n\n            <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                Understand what your investments are supposed to do.\n            <\/h2>\n\n\n            <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                An investment should have a role within the financial plan.\n                Learn the basic concepts behind asset allocation, portfolio\n                construction, risk and investment selection.\n            <\/p>\n\n        <\/div>\n\n\n        <div class=\"mt-14 grid gap-5 md:grid-cols-2 lg:grid-cols-4\">\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-navy-900 text-white\">\n\n                    <span class=\"text-sm font-extrabold\">\n                        01\n                    <\/span>\n\n                <\/div>\n\n                <h3 class=\"mt-6 font-bold text-navy-900\">\n                    Asset allocation\n                <\/h3>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Understand why portfolios may combine assets with different characteristics.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-teal-50 text-teal-700\">\n\n                    <span class=\"text-sm font-extrabold\">\n                        02\n                    <\/span>\n\n                <\/div>\n\n                <h3 class=\"mt-6 font-bold text-navy-900\">\n                    Time horizon\n                <\/h3>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Understand how the time available can affect investment decisions.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-slate-100 text-navy-900\">\n\n                    <span class=\"text-sm font-extrabold\">\n                        03\n                    <\/span>\n\n                <\/div>\n\n                <h3 class=\"mt-6 font-bold text-navy-900\">\n                    Volatility\n                <\/h3>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Learn why investment values can fluctuate and why that matters.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-slate-100 text-navy-900\">\n\n                    <span class=\"text-sm font-extrabold\">\n                        04\n                    <\/span>\n\n                <\/div>\n\n                <h3 class=\"mt-6 font-bold text-navy-900\">\n                    Portfolio fit\n                <\/h3>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    A product should be considered in relation to the rest of your portfolio.\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n\n        <div class=\"mt-8\">\n\n            <a\n                href=\"invest.html\"\n                class=\"inline-flex items-center gap-2 rounded-xl bg-navy-900 px-6 py-3.5 text-sm font-semibold text-white transition hover:bg-navy-800\"\n            >\n                Explore Investment Planning\n                <span>→<\/span>\n            <\/a>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     RISK\n========================================================= -->\n\n<section\n    id=\"risk\"\n    class=\"scroll-mt-32 bg-white py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n\n        <div class=\"grid gap-14 lg:grid-cols-2 lg:items-center\">\n\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                    Risk\n                <\/p>\n\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                    Risk is a financial concept, not just a feeling.\n                <\/h2>\n\n\n                <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                    Your reaction to market uncertainty matters, but so does\n                    your actual financial ability to absorb adverse outcomes.\n                <\/p>\n\n\n                <a\n                    href=\"invest.html#risk\"\n                    class=\"mt-8 inline-flex items-center gap-2 text-sm font-bold text-navy-900\"\n                >\n                    Explore risk in investment planning\n                    <span>→<\/span>\n                <\/a>\n\n            <\/div>\n\n\n            <div class=\"rounded-[28px] border border-slate-200 bg-slate-50 p-6 sm:p-8\">\n\n\n                <div class=\"space-y-6\">\n\n\n                    <div>\n\n                        <div class=\"flex items-center justify-between\">\n\n                            <h3 class=\"font-bold text-navy-900\">\n                                Risk capacity\n                            <\/h3>\n\n                            <span class=\"text-xs font-bold text-teal-700\">\n                                Ability\n                            <\/span>\n\n                        <\/div>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                            The financial ability to absorb losses or uncertainty.\n                        <\/p>\n\n                    <\/div>\n\n\n                    <div class=\"h-px bg-slate-200\"><\/div>\n\n\n                    <div>\n\n                        <div class=\"flex items-center justify-between\">\n\n                            <h3 class=\"font-bold text-navy-900\">\n                                Risk tolerance\n                            <\/h3>\n\n                            <span class=\"text-xs font-bold text-teal-700\">\n                                Willingness\n                            <\/span>\n\n                        <\/div>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                            The degree of uncertainty or volatility a person is willing to accept.\n                        <\/p>\n\n                    <\/div>\n\n\n                    <div class=\"h-px bg-slate-200\"><\/div>\n\n\n                    <div>\n\n                        <div class=\"flex items-center justify-between\">\n\n                            <h3 class=\"font-bold text-navy-900\">\n                                Risk requirement\n                            <\/h3>\n\n                            <span class=\"text-xs font-bold text-teal-700\">\n                                Goal\n                            <\/span>\n\n                        <\/div>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                            The level of risk associated with pursuing a particular financial outcome.\n                        <\/p>\n\n                    <\/div>\n\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     DECISIONS\n========================================================= -->\n\n<section\n    id=\"decisions\"\n    class=\"scroll-mt-32 py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n\n        <div class=\"max-w-3xl\">\n\n            <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                Decisions\n            <\/p>\n\n\n            <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                Better decisions start with better questions.\n            <\/h2>\n\n\n            <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                Instead of asking only which product is best, understand the\n                financial problem, available alternatives, constraints and\n                consequences.\n            <\/p>\n\n        <\/div>\n\n\n        <div class=\"mt-14 grid gap-5 lg:grid-cols-3\">\n\n\n            <article class=\"rounded-[24px] border border-slate-200 bg-white p-7 shadow-card\">\n\n                <div class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                    Question 01\n                <\/div>\n\n                <h3 class=\"mt-5 text-xl font-bold text-navy-900\">\n                    What am I trying to achieve?\n                <\/h3>\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    Start with the financial outcome rather than the product.\n                <\/p>\n\n            <\/article>\n\n\n            <article class=\"rounded-[24px] border border-slate-200 bg-white p-7 shadow-card\">\n\n                <div class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                    Question 02\n                <\/div>\n\n                <h3 class=\"mt-5 text-xl font-bold text-navy-900\">\n                    What are my alternatives?\n                <\/h3>\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    A financial decision can have several possible approaches.\n                <\/p>\n\n            <\/article>\n\n\n            <article class=\"rounded-[24px] border border-slate-200 bg-white p-7 shadow-card\">\n\n                <div class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                    Question 03\n                <\/div>\n\n                <h3 class=\"mt-5 text-xl font-bold text-navy-900\">\n                    What changes if I choose each one?\n                <\/h3>\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    Understand the trade-offs before selecting an approach.\n                <\/p>\n\n            <\/article>\n\n        <\/div>\n\n\n        <div class=\"mt-8\">\n\n            <a\n                href=\"decide.html\"\n                class=\"inline-flex items-center gap-2 rounded-xl bg-navy-900 px-6 py-3.5 text-sm font-semibold text-white transition hover:bg-navy-800\"\n            >\n                Explore Financial Decisions\n                <span>→<\/span>\n            <\/a>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     BASICS\n========================================================= -->\n\n<section\n    id=\"basics\"\n    class=\"scroll-mt-32 bg-white py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n\n        <div class=\"text-center\">\n\n            <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                Financial basics\n            <\/p>\n\n\n            <h2 class=\"mx-auto mt-4 max-w-3xl text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                Start with the numbers that describe your financial life.\n            <\/h2>\n\n        <\/div>\n\n\n        <div class=\"mx-auto mt-14 grid max-w-5xl gap-4 sm:grid-cols-2 lg:grid-cols-4\">\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-slate-50 p-6\">\n\n                <p class=\"text-3xl font-extrabold text-navy-900\">\n                    Income\n                <\/p>\n\n                <p class=\"mt-3 text-sm leading-6 text-slate-500\">\n                    Money coming into your financial life.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-slate-50 p-6\">\n\n                <p class=\"text-3xl font-extrabold text-navy-900\">\n                    Expenses\n                <\/p>\n\n                <p class=\"mt-3 text-sm leading-6 text-slate-500\">\n                    Money required to maintain your current lifestyle and obligations.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-slate-50 p-6\">\n\n                <p class=\"text-3xl font-extrabold text-navy-900\">\n                    Assets\n                <\/p>\n\n                <p class=\"mt-3 text-sm leading-6 text-slate-500\">\n                    Things of financial value that you own.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-slate-50 p-6\">\n\n                <p class=\"text-3xl font-extrabold text-navy-900\">\n                    Liabilities\n                <\/p>\n\n                <p class=\"mt-3 text-sm leading-6 text-slate-500\">\n                    Financial obligations that you owe.\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n\n        <div class=\"mx-auto mt-10 max-w-3xl rounded-2xl border border-teal-100 bg-teal-50 p-6 text-center\">\n\n            <p class=\"text-sm leading-7 text-slate-600\">\n                These basic elements provide the starting context for many\n                financial planning and decision-making questions.\n            <\/p>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\ ument.getElementById('searchInput');\n\n        const articles =\n            document.querySelectorAll('.article-item');\n\n        const noResults =\n            document.getElementById('noResults');\n\n\n        /* Current year */\n\n        if (currentYear) {\n\n            currentYear.textContent =\n                new Date().getFullYear();\n\n        }\n\n\n        /* Mobile menu */\n\n        if (menuButton && mobileMenu) {\n\n            menuButton.addEventListener('click', function () {\n\n                const isHidden =\n                    mobileMenu.classList.contains('hidden');\n\n                mobileMenu.classList.toggle('hidden');\n\n                menuButton.setAttribute(\n                    'aria-expanded',\n                    String(isHidden)\n                );\n\n            });\n\n\n            mobileMenu\n                .querySelectorAll('a')\n                .forEach(function (link) {\n\n                    link.addEventListener('click', function () {\n\n                        mobileMenu.classList.add('hidden');\n\n                        menuButton.setAttribute(\n                            'aria-expanded',\n                            'false'\n                        );\n\n                    });\n\n                });\n\n        }\n\n\n        /* Article search */\n\n        if (searchInput) {\n\n            searchInput.addEventListener('input', function () {\n\n                const query =\n                    searchInput.value\n                        .trim()\n                        .toLowerCase();\n\n                let visibleCount = 0;\n\n\n                articles.forEach(function (article) {\n\n                    const searchableText =\n                        (\n                            article.dataset.search +\n                            ' ' +\n                            article.innerText\n                        ).toLowerCase();\n\n\n                    const matches =\n                        query === '' ||\n n\n                <a\n                    href=\"invest.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Invest\n                <\/a>\n\n                <a\n                    href=\"protect.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Protect\n                <\/a>\n\n                <a\n                    href=\"decide.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Decide\n                <\/a>\n\n                <a\n                    href=\"learn.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Learn\n                <\/a>\n\n                <a\n                    href=\"about.html\"\n                    class=\"rounded-lg bg-slate-50 px-3 py-3 text-sm font-bold text-navy-900\"\n                >\n                    About\n                <\/a>\n\n\n                <div class=\"mt-3 grid grid-cols-2 gap-3 border-t border-slate-100 pt-4\">\n\n                    <a\n                        href=\"login.html\"\n                        class=\"rounded-xl border border-slate-200 px-4 py-3 text-center text-sm font-semibold text-navy-900\"\n                    >\n                        Login\n                    <\/a>\n\n                    <a\n                        href=\"#start\"\n                        class=\"rounded-xl bg-navy-900 px-4 py-3 text-center text-sm font-semibold text-white\"\n                    >\n                        Start Planning\n                    <\/a>\n\n                <\/div>\n\n            <\/div>\n\n        <\/nav>\n\n    <\/div>\n\n<\/header>\n\n\n<main>\n\n\n<!-- =========================================================\n     HERO\n======================================== t-sm font-semibold text-navy-900 transition hover:bg-slate-50\"\n                >\n                    Why we built it\n                <\/a>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     MISSION\n========================================================= -->\n\n<section\n    id=\"why\"\n    class=\"scroll-mt-32 bg-white py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[0.75fr_1.25fr] lg:items-center\">\n\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                    Why Planvesto\n                <\/p>\n\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                    Move financial planning from products to decisions.\n                <\/h2>\n\n            <\/div>\n\n\n            <div>\n\n                <p class=\"text-lg leading-8 text-slate-600\">\n                    People are often presented with investments, insurance\n                    products or financial solutions before the underlying\n                    financial problem has been clearly understood.\n                <\/p>\n\n\n                <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                    Planvesto takes the opposite approach. Understand the\n                    financial position. Define the goals. Identify constraints.\n                    Consider risk and protection. Then evaluate the strategies\n                    that can address the actual need.\n                <\/p>\n\n\n                <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                    The objective is not to make financial decisions more\n                    complicated. It is to make the reasoning behind them clearer.\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     WHAT PLANVESTO IS\n========================================================= -->\n\n<section class=\"py-24 lg:py-32\">\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n\n        <div class=\"max-w-3xl\">\n\n            <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                What Planvesto is\n            <\/p>\n\n\n            <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                A financial planning and decision platform.\n            <\/h2>\n\n\n            <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                Planvesto brings financial information, planning, investment\n                decisions, protection and financial strategies into one\n                connected experience.\n            <\/p>\n\n        <\/div>\n\n\n        <div class=\"mt-14 grid gap-5 md:grid-cols-2 lg:grid-cols-3\">\n\n\n            <!-- Plan -->\n\n            <div class=\"value-card rounded-[24px] border border-slate-200 bg-white p-7 shadow-card\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-teal-50 text-teal-700\">\n\n                    <svg\n                        class=\"h-5 w-5\"\n                        fill=\"none\"\n                        stroke=\"currentColor\"\n                        viewBox=\"0 0 24 24\"\n                    >\n\n                        <path\n                            d=\"M5 19V8M12 19V5M19 19v-9\"\n                            stroke-width=\"1.8\"\n                            stroke-linecap=\"round\"\n                        />\n\n                    <\/svg>\n\n                <\/div>\n\n\n                <h3 class=\"mt-6 text-xl font-bold text-navy-900\">\n                    Plan\n                <\/h3>\n\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    Understand your current financial position and translate\n                    your goals into a financial plan.\n                <\/p>\n\n\n                <a\n                    href=\"plan.html\"\n                    class=\"mt-6 inline-flex items-center gap-2 text-sm font-bold text-navy-900\"\n                >\n                    Explore Plan\n                    <span>→<\/span>\n                <\/a>\n\n            <\/div>\n\n\n            <!-- Invest -->\n\n            <div class=\"value-card rounded-[24px] border border-slate-200 bg-white p-7 shadow-card\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-navy-900 text-white\">\n\n                    <svg\n                        class=\"h-5 w-5\"\n                        fill=\"none\"\n                        stroke=\"currentColor\"\n                        viewBox=\"0 0 24 24\"\n                    >\n\n                        <path\n                            d=\"M5 17l5-5 3 3 6-7\"\n                            stroke-width=\"1.8\"\n                            stroke-linecap=\"round\"\n                            stroke-linejoin=\"round\"\n                        />\n\n                        <path\n                            d=\"M15 8h4v4\"\n                            stroke-width=\"1.8\"\n                            stroke-linecap=\"round\"\n                            stroke-linejoin=\"round\"\n                        />\n\n                    <\/svg>\n\n                <\/div>\n\n\n                <h3 class=\"mt-6 text-xl font-bold text-navy-900\">\n                    Invest\n                <\/h3>\n\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    Understand the role investments play in achieving financial\n                    goals and managing risk.\n                <\/p>\n\n\n                <a\n                    href=\"invest.html\"\n                    class=\"mt-6 inline-flex items-center gap-2 text-sm font-bold text-navy-900\"\n                >\n                    Explore Invest\n                    <span>→<\/span>\n                <\/a>\n\n            <\/div>\n\n\n            <!-- Protect -->\n\n            <div class=\"value-card rounded-[24px] border border-slate-200 bg-white p-7 shadow-card\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-slate-100 text-navy-900\">\n\n                    <svg\n                        class=\"h-5 w-5\"\n                        fill=\"none\"\n                        stroke=\"currentColor\"\n                        viewBox=\"0 0 24 24\"\n                    >\n\n                        <path\n                            d=\"M12 3l8 4v5c0 4.8-3.4 7.9-8 9-4.6-1.1-8-4.2-8-9V7l8-4z\"\n                            stroke-width=\"1.8\"\n                            stroke-linejoin=\"round\"\n                        />\n\n                    <\/svg>\n\n                <\/div>\n\n\n                <h3 class=\"mt-6 text-xl font-bold text-navy-900\">\n                    Protect\n                <\/h3>\n\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    Consider financial risks and the protection required to\n                    keep important goals on track.\n                <\/p>\n\n\n                <a\n                    href=\"protect.html\"\n                    class=\"mt-6 inline-flex items-center gap-2 text-sm font-bold text-navy-900\"\n                >\n                    Explore Protect\n                    <span>→<\/span>\n                <\/a>\n\n            <\/div>\n\n\n            <!-- Decide -->\n\n            <div class=\"value-card rounded-[24px] border border-slate-200 bg-white p-7 shadow-card\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-teal-50 text-teal-700\">\n\n                    <svg\n                        class=\"h-5 w-5\"\n                        fill=\"none\"\n                        stroke=\"currentColor\"\n                        viewBox=\"0 0 24 24\"\n                    >\n\n                        <circle\n                            cx=\"12\"\n                            cy=\"12\"\n                            r=\"8\"\n                            stroke-width=\"1.8\"\n                        />\n\n                        <path\n                            d=\"M12 8v4l3 2\"\n                            stroke-width=\"1.8\"\n                            stroke-linecap=\"round\"\n                        />\n\n                    <\/svg>\n\n                <\/div>\n\n\n                <h3 class=\"mt-6 text-xl font-bold text-navy-900\">\n                    Decide\n                <\/h3>\n\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    Compare relevant strategies and understand the trade-offs\n                    before selecting a financial path.\n                <\/p>\n\n\n                <a\n                    href=\"decide.html\"\n                    class=\"mt-6 inline-flex items-center gap-2 text-sm font-bold text-navy-900\"\n                >\n                    Explore Decide\n                    <span>→<\/span>\n                <\/a>\n\n            <\/div>\n\n\n            <!-- Learn -->\n\n            <div class=\"value-card rounded-[24px] border border-slate-200 bg-white p-7 shadow-card\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-slate-100 text-navy-900\">\n\n                    <svg\n                        class=\"h-5 w-5\"\n                        fill=\"none\"\n                        stroke=\"currentColor\"\n                        viewBox=\"0 0 24 24\"\n                    >\n\n                        <path\n                            d=\"M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 014 16.5v-11z\"\n                            stroke-width=\"1.8\"\n                            stroke-linejoin=\"round\"\n                        />\n\n                        <path\n                            d=\"M8 7h8M8 11h6\"\n                            stroke-width=\"1.8\"\n                            stroke-linecap=\"round\"\n                        />\n\n                    <\/svg>\n\n                <\/div>\n\n\n                <h3 class=\"mt-6 text-xl font-bold text-navy-900\">\n                    Learn\n                <\/h3>\n\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    Build the financial understanding needed to participate\n                    meaningfully in your own decisions.\n                <\/p>\n\n\n                <a\n                    href=\"learn.html\"\n                    class=\"mt-6 inline-flex items-center gap-2 text-sm font-bold text-navy-900\"\n                >\n                    Explore Learn\n                    <span>→<\/span>\n                <\/a>\n\n            <\/div>\n\n\n            <!-- Connected system -->\n\n            <div class=\"value-card rounded-[24px] border border-teal-100 bg-teal-50 p-7\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-white text-teal-700\">\n\n                    <svg\n                        class=\"h-5 w-5\"\n                        fill=\"none\"\n                        stroke=\"currentColor\"\n                        viewBox=\"0 0 24 24\"\n                    >\n\n                        <circle\n                            cx=\"6\"\n                            cy=\"12\"\n                            r=\"2.5\"\n                            stroke-width=\"1.8\"\n                        />\n\n                        <circle\n                            cx=\"18\"\n                            cy=\"6\"\n                            r=\"2.5\"\n                            stroke-width=\"1.8\"\n                        />\n\n                        <circle\n                            cx=\"18\"\n                            cy=\"18\"\n                            r=\"2.5\"\n                            stroke-width=\"1.8\"\n                        />\n\n                        <path\n                            d=\"M8.3 10.8l7.4-3.6M8.3 13.2l7.4 3.6\"\n                            stroke-width=\"1.8\"\n                            stroke-linecap=\"round\"\n                        />\n\n                    <\/svg>\n\n                <\/div>\n\n\n                <h3 class=\"mt-6 text-xl font-bold text-navy-900\">\n                    Connected thinking\n                <\/h3>\n\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-600\">\n                    The different parts of financial planning are considered\n                    together rather than as isolated product decisions.\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     APPROACH\n========================================================= -->\n\n<section class=\"bg-navy-900 py-24 text-white lg:py-32\">\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n\n        <div class=\"grid gap-14 lg:grid-cols-[0.8fr_1.2fr]\">\n\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-300\">\n                    Our approach\n                <\/p>\n\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] sm:text-5xl\">\n                    The sequence matters.\n                <\/h2>\n\n\n                <p class=\"mt-6 max-w-lg text-base leading-7 text-slate-300\">\n                    Planvesto is designed around the idea that financial\n                    planning works better when decisions follow a logical sequence.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"space-y-4\">\n\n\n                <div class=\"rounded-2xl border border-white/10 bg-white/5 p-6\">\n\n                    <div class=\"flex gap-5\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/10 text-sm font-bold\">\n                            01\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"font-bold\">\n                                Understand\n                            <\/h3>\n\n                            <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                                Understand the financial position, goals,\n                                constraints and relevant risks.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-white/10 bg-white/5 p-6\">\n\n                    <div class=\"flex gap-5\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/10 text-sm font-bold\">\n                            02\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"font-bold\">\n                                Diagnose\n                            <\/h3>\n\n                            <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                                Identify the financial problem or opportunity\n                                that needs to be addressed.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-white/10 bg-white/5 p-6\">\n\n                    <div class=\"flex gap-5\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/10 text-sm font-bold\">\n                            03\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"font-bold\">\n                                Evaluate\n                            <\/h3>\n\n                            <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                                Consider strategies and compare the consequences\n                                of relevant alternatives.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-teal-500/30 bg-teal-500/10 p-6\">\n\n                    <div class=\"flex gap-5\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-teal-600 text-sm font-bold\">\n                            04\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"font-bold\">\n                                Act\n                            <\/h3>\n\n                            <p class=\"mt-2 text-sm leading-6 text-slate-300\">\n                                Translate the selected financial plan into\n                                implementation actions and review it as circumstances change.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     PRINCIPLES\n========================================================= -->\n\n<section class=\"py-24 lg:py-32\">\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n\n        <div class=\"text-center\">\n\n            <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                Principles\n            <\/p>\n\n\n            <h2 class=\"mx-auto mt-4 max-w-3xl text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                What we believe good financial planning should do.\n            <\/h2>\n\n        <\/div>\n\n\n        <div class=\"mt-14 grid gap-5 md:grid-cols-2\">\n\n\n            <div class=\"rounded-[24px] border border-slate-200 bg-white p-7 shadow-card\">\n\n                <span class=\"text-sm font-bold text-teal-700\">\n                    01\n                <\/span>\n\n                <h3 class=\"mt-5 text-xl font-bold text-navy-900\">\n                    Start with the person, not the product.\n                <\/h3>\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    Financial recommendations should make sense in the context\n                    of the person's financial situation and goals.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-[24px] border border-slate-200 bg-white p-7 shadow-card\">\n\n                <span class=\"text-sm font-bold text-teal-700\">\n                    02\n                <\/span>\n\n                <h3 class=\"mt-5 text-xl font-bold text-navy-900\">\n                    Consider the whole picture.\n                <\/h3>\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    Investment, protection, cash flow, goals and risk can\n                    influence each other.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-[24px] border border-slate-200 bg-white p-7 shadow-card\">\n\n                <span class=\"text-sm font-bold text-teal-700\">\n                    03\n                <\/span>\n\n                <h3 class=\"mt-5 text-xl font-bold text-navy-900\">\n                    Compare before deciding.\n                <\/h3>\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    A decision becomes more meaningful when alternatives and\n                    their trade-offs can be understood.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-[24px] border border-slate-
