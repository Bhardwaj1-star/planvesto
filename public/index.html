                       fill=\"none\"\n                                        stroke=\"currentColor\"\n                                        viewBox=\"0 0 24 24\"\n                                    >\n                                        <path\n                                            d=\"M5 12l4 4L19 6\"\n                                            stroke-width=\"1.8\"\n                                            stroke-linecap=\"round\"\n                                            stroke-linejoin=\"round\"\n                                        />\n                                    <\/svg>\n\n                                <\/div>\n\n                                <div>\n\n                                    <p class=\"text-sm font-bold text-navy-900\">\n                                        Existing protection\n                                    <\/p>\n\n                                    <p class=\"text-xs text-slate-400\">\n                                        Effective cover\n                                    <\/p>\n\n                                <\/div>\n\n                            <\/div>\n\n                            <span class=\"text-sm font-extrabold text-navy-900\">\n                                ₹75L\n                            <\/span>\n\n                        <\/div>\n\n\n                        <div class=\"rounded-2xl border border-teal-100 bg-teal-50 p-5\">\n\n                            <div class=\"flex items-center justify-between\">\n\n                                <div>\n\n                                    <p class=\"text-xs font-semibold uppercase tracking-wider text-teal-700\">\n                                        Protection gap\n                                    <\/p>\n\n                                    <p class=\"mt-1 text-2xl font-extrabold text-navy-900\">\n                                        ₹25L\n                                    <\/p>\n\n                                <\/div>\n\n                                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-white text-teal-700\">\n\n                                    <svg\n                                        class=\"h-5 w-5\"\n                                        fill=\"none\"\n                                        stroke=\"currentColor\"\n                                        viewBox=\"0 0 24 24\"\n                                    >\n                                        <path\n                                            d=\"M12 9v4M12 17h.01\"\n                                            stroke-width=\"2\"\n                                            stroke-linecap=\"round\"\n                                        />\n\n                                        <path\n                                            d=\"M10.3 4.5L3.2 17a2 2 0 001.7 3h14.2a2 2 0 001.7-3L13.7 4.5a2 2 0 00-3.4 0z\"\n                                            stroke-width=\"1.7\"\n                                            stroke-linejoin=\"round\"\n                                        />\n                                    <\/svg>\n\n                                <\/div>\n\n                            <\/div>\n\n                            <p class=\"mt-3 text-xs leading-5 text-slate-500\">\n                                Example only. Actual protection requirements\n                                depend on your financial circumstances and risks.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     ANCHOR NAV\n========================================================= -->\n\n<section class=\"sticky top-20 z-40 border-y border-slate-200 bg-white/95 backdrop-blur-xl\">\n\n    <div class=\"mx-auto max-w-[1200px] overflow-x-auto px-5 lg:px-8\">\n\n        <nav class=\"flex min-w-max items-center gap-7 py-4\">\n\n            <a\n                href=\"#risks\"\n                class=\"text-sm font-semibold text-slate-500 transition hover:text-navy-900\"\n            >\n                Risks\n            <\/a>\n\n            <a\n                href=\"#need\"\n                class=\"text-sm font-semibold text-slate-500 transition hover:text-navy-900\"\n            >\n                Protection Need\n            <\/a>\n\n            <a\n                href=\"#gap\"\n                class=\"text-sm font-semibold text-slate-500 transition hover:text-navy-900\"\n            >\n                Protection Gap\n            <\/a>\n\n            <a\n                href=\"#strategy\"\n                class=\"text-sm font-semibold text-slate-500 transition hover:text-navy-900\"\n            >\n                Strategy\n            <\/a>\n\n            <a\n                href=\"#monitoring\"\n                class=\"text-sm font-semibold text-slate-500 transition hover:text-navy-900\"\n            >\n                Monitoring\n            <\/a>\n\n        <\/nav>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     RISKS\n========================================================= -->\n\n<section\n    id=\"risks\"\n    class=\"scroll-mt-32 py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[0.8fr_1.2fr] lg:items-start\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                    01 · Financial risks\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                    What could disrupt the plan?\n                <\/h2>\n\n                <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                    Protection starts by understanding the financial consequences\n                    of risks affecting your income, family, liabilities, assets\n                    and goals.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"grid gap-4 sm:grid-cols-2\">\n\n                <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                    <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-navy-900 text-white\">\n\n                        <svg\n                            class=\"h-5 w-5\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n                            <path\n                                d=\"M12 3v18M7 8h8a3 3 0 010 6H9a3 3 0 000 6h8\"\n                                stroke-width=\"1.8\"\n                                stroke-linecap=\"round\"\n                            />\n                        <\/svg>\n\n                    <\/div>\n\n                    <h3 class=\"mt-5 font-bold text-navy-900\">\n                        Income risk\n                    <\/h3>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        What happens to the financial plan if an important income source is affected?\n                    <\/p>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                    <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-teal-50 text-teal-700\">\n\n                        <svg\n                            class=\"h-5 w-5\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n                            <path\n                                d=\"M12 3l8 4v5c0 4.8-3.4 7.9-8 9-4.6-1.1-8-4.2-8-9V7l8-4z\"\n                                stroke-width=\"1.8\"\n                                stroke-linejoin=\"round\"\n                            />\n                        <\/svg>\n\n                    <\/div>\n\n                    <h3 class=\"mt-5 font-bold text-navy-900\">\n                        Family risk\n                    <\/h3>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        How could a major life event affect dependents and their financial goals?\n                    <\/p>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                    <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-slate-100 text-navy-900\">\n\n                        <svg\n                            class=\"h-5 w-5\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n                            <path\n                                d=\"M4 19h16M6 16V8M10 16V5M14 16v-4M18 16V7\"\n                                stroke-width=\"1.8\"\n                                stroke-linecap=\"round\"\n                            />\n                        <\/svg>\n\n                    <\/div>\n\n                    <h3 class=\"mt-5 font-bold text-navy-900\">\n                        Liability risk\n                    <\/h3>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        Could existing debt or financial obligations become difficult to service?\n                    <\/p>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                    <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-slate-100 text-navy-900\">\n\n                        <svg\n                            class=\"h-5 w-5\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n                            <path\n                                d=\"M4 19V9l4 3V7l4 3V5l8 5v9H4z\"\n                                stroke-width=\"1.8\"\n                                stroke-linejoin=\"round\"\n                            />\n                        <\/svg>\n\n                    <\/div>\n\n                    <h3 class=\"mt-5 font-bold text-navy-900\">\n                        Goal risk\n                    <\/h3>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        Which financial goals could be affected by an unexpected event?\n                    <\/p>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     PROTECTION NEED\n========================================================= -->\n\n<section\n    id=\"need\"\n    class=\"scroll-mt-32 bg-white py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"max-w-3xl\">\n\n            <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                02 · Protection need\n            <\/p>\n\n            <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                How much protection does the situation actually require?\n            <\/h2>\n\n            <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                The question is not simply whether a policy exists. The\n                relevant question is whether the existing protection is\n                sufficient for the financial exposure.\n            <\/p>\n\n        <\/div>\n\n\n        <div class=\"mt-14 rounded-[28px] border border-slate-200 bg-slate-50 p-6 sm:p-8\">\n\n            <div class=\"grid gap-6 lg:grid-cols-3\">\n\n                <div class=\"rounded-2xl bg-white p-6 shadow-sm\">\n\n                    <p class=\"text-xs font-bold uppercase tracking-wider text-slate-400\">\n                        Financial exposure\n                    <\/p>\n\n                    <p class=\"mt-3 text-3xl font-extrabold text-navy-900\">\n                        ₹1.00Cr\n                    <\/p>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        Example financial requirement arising from identified risks.\n                    <\/p>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl bg-white p-6 shadow-sm\">\n\n                    <p class=\"text-xs font-bold uppercase tracking-wider text-slate-400\">\n                        Existing effective protection\n                    <\/p>\n\n                    <p class=\"mt-3 text-3xl font-extrabold text-navy-900\">\n                        ₹75L\n                    <\/p>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        Existing protection that can meaningfully address the exposure.\n                    <\/p>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-teal-100 bg-teal-50 p-6\">\n\n                    <p class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                        Remaining gap\n                    <\/p>\n\n                    <p class=\"mt-3 text-3xl font-extrabold text-navy-900\">\n                        ₹25L\n                    <\/p>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        The portion that may still require a financial response.\n                    <\/p>\n\n                <\/div>\n\n            <\/div>\n\n\n            <div class=\"mt-8 border-t border-slate-200 pt-7\">\n\n                <p class=\"text-sm leading-7 text-slate-500\">\n                    These figures are illustrative only. The underlying Planvesto\n                    protection workflow calculates need, effective existing\n                    protection and the resulting gap from the investor's\n                    financial circumstances and selected methodology.\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     PROTECTION GAP\n========================================================= -->\n\n<section\n    id=\"gap\"\n    class=\"scroll-mt-32 py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[1fr_1fr] lg:items-center\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                    03 · Protection gap\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                    Existing cover is only part of the picture.\n                <\/h2>\n\n                <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                    A protection review considers the effective protection\n                    already available and the resources that may be usable\n                    before determining the remaining gap.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-[28px] border border-slate-200 bg-white p-6 shadow-soft sm:p-8\">\n\n                <div class=\"space-y-6\">\n\n                    <div class=\"flex items-start gap-4\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-navy-900 text-sm font-bold text-white\">\n                            01\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"font-bold text-navy-900\">\n                                Identify the exposure\n                            <\/h3>\n\n                            <p class=\"mt-1 text-sm leading-6 text-slate-500\">\n                                Understand what financial risk could affect the plan.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n\n                    <div class=\"flex items-start gap-4\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-teal-600 text-sm font-bold text-white\">\n                            02\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"font-bold text-navy-900\">\n                                Review existing protection\n                            <\/h3>\n\n                            <p class=\"mt-1 text-sm leading-6 text-slate-500\">\n                                Consider current policies and other effective resources.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n\n                    <div class=\"flex items-start gap-4\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-sm font-bold text-navy-900\">\n                            03\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"font-bold text-navy-900\">\n                                Identify the residual gap\n                            <\/h3>\n\n                            <p class=\"mt-1 text-sm leading-6 text-slate-500\">\n                                Determine what remains after existing protection is considered.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n\n                    <div class=\"flex items-start gap-4\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-sm font-bold text-navy-900\">\n                            04\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"font-bold text-navy-900\">\n                                Map the affected goals\n                            <\/h3>\n\n                            <p class=\"mt-1 text-sm leading-6 text-slate-500\">\n                                Understand which financial objectives could be affected.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     STRATEGY\n========================================================= -->\n\n<section\n    id=\"strategy\"\n    class=\"scroll-mt-32 bg-navy-900 py-24 text-white lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[0.9fr_1.1fr] lg:items-center\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-300\">\n                    04 · Protection strategy\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] sm:text-5xl\">\n                    There can be more than one way to address a gap.\n                <\/h2>\n\n                <p class=\"mt-6 max-w-xl text-base leading-7 text-slate-300\">\n                    A protection strategy considers the identified gap together\n                    with cash flow, goals and the wider financial position.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"space-y-4\">\n\n                <div class=\"rounded-2xl border border-white/10 bg-white/5 p-6\">\n\n                    <div class=\"flex items-start gap-4\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white/10 text-sm font-bold\">\n                            A\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"font-bold text-white\">\n                                Transfer the risk\n                            <\/h3>\n\n                            <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                                Use suitable protection products to transfer part\n                                of the identified financial exposure.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-white/10 bg-white/5 p-6\">\n\n                    <div class=\"flex items-start gap-4\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white/10 text-sm font-bold\">\n                            B\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"font-bold text-white\">\n                                Self-fund part of the risk\n                            <\/h3>\n\n                            <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                                Existing usable resources may form part of the\n                                response where appropriate.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-white/10 bg-white/5 p-6\">\n\n                    <div class=\"flex items-start gap-4\">\n\n                        <div class=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white/10 text-sm font-bold\">\n                            C\n                        <\/div>\n\n                        <div>\n\n                            <h3 class=\"font-bold text-white\">\n                                Change the financial plan\n                            <\/h3>\n\n                            <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                                In some circumstances, changing goals, cash flow\n                                or other financial actions can also affect the response.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-teal-500/20 bg-teal-500/10 p-6\">\n\n                    <p class=\"text-sm font-bold text-teal-300\">\n                        The cost matters too.\n                    <\/p>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-300\">\n                        Any protection strategy needs to be considered against\n                        its effect on surplus, liquidity, goals and the wider plan.\n                    <\/p>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     VALIDATION\n========================================================= -->\n\n<section class=\"py-24 lg:py-32\">\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"text-center\">\n\n            <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                Validate before deciding\n            <\/p>\n\n            <h2 class=\"mx-auto mt-4 max-w-3xl text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                More cover is not automatically a better decision.\n            <\/h2>\n\n            <p class=\"mx-auto mt-5 max-w-2xl text-lg leading-8 text-slate-600\">\n                The protection decision needs to work financially as well as\n                address the underlying risk.\n            <\/p>\n\n        <\/div>\n\n\n        <div class=\"mt-14 grid gap-5 md:grid-cols-2 lg:grid-cols-4\">\n\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                <div class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                    Check 01\n                <\/div>\n\n                <h3 class=\"mt-4 font-bold text-navy-900\">\n                    Coverage fit\n                <\/h3>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Does the protection address the identified exposure?\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                <div class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                    Check 02\n                <\/div>\n\n                <h3 class=\"mt-4 font-bold text-navy-900\">\n                    Affordability\n                <\/h3>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    What does the premium do to available cash flow?\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                <div class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                    Check 03\n                <\/div>\n\n                <h3 class=\"mt-4 font-bold text-navy-900\">\n                    Liquidity impact\n                <\/h3>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Does the decision leave adequate liquidity?\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                <div class=\"text-xs font-bold uppercase tracking-wider text-teal-700\">\n                    Check 04\n                <\/div>\n\n                <h3 class=\"mt-4 font-bold text-navy-900\">\n                    Goal impact\n                <\/h3>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Does the protection strategy interfere with important goals?\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     MONITORING\n========================================================= -->\n\n<section\n    id=\"monitoring\"\n    class=\"scroll-mt-32 bg-white py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[0.85fr_1.15fr] lg:items-center\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                    05 · Monitoring\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                    Protection is not a one-time decision.\n                <\/h2>\n\n                <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                    Your financial position changes. Policies expire.\n                    Coverage changes. Goals move. A protection plan therefore\n                    needs to be reviewed as circumstances change.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-[28px] border border-slate-200 bg-slate-50 p-6 sm:p-8\">\n\n                <div class=\"space-y-4\">\n\n                    <div class=\"flex items-center justify-between rounded-2xl bg-white p-5 shadow-sm\">\n\n                        <div>\n\n                            <p class=\"text-sm font-bold text-navy-900\">\n                                Coverage amount\n                            <\/p>\n\n                            <p class=\"mt-1 text-xs text-slate-400\">\n                                Compare required vs actual protection\n                            <\/p>\n\n                        <\/div>\n\n                        <span class=\"rounded-lg bg-teal-50 px-3 py-1.5 text-xs font-bold text-teal-700\">\n                            Review\n                        <\/span>\n\n                    <\/div>\n\n\n                    <div class=\"flex items-center justify-between rounded-2xl bg-white p-5 shadow-sm\">\n\n                        <div>\n\n                            <p class=\"text-sm font-bold text-navy-900\">\n                                Policy expiry\n                            <\/p>\n\n                            <p class=\"mt-1 text-xs text-slate-400\">\n                                Track important dates\n                            <\/p>\n\n                        <\/div>\n\n                        <span class=\"rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-bold text-navy-900\">\n                            Track\n                        <\/span>\n\n                    <\/div>\n\n\n                    <div class=\"flex items-center justify-between rounded-2xl bg-white p-5 shadow-sm\">\n\n                        <div>\n\n                            <p class=\"text-sm font-bold text-navy-900\">\n                                Financial changes\n                            <\/p>\n\n                            <p class=\"mt-1 text-xs text-slate-400\">\n                                Income, goals, liabilities and assets\n                            <\/p>\n\n                        <\/div>\n\n                        <span class=\"rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-bold text-navy-900\">\n                            Update\n                        <\/span>\n\n                    <\/div>\n\n\n                    <div class=\"flex items-center justify-between rounded-2xl bg-white p-5 shadow-sm\">\n\n                        <div>\n\n                            <p class=\"text-sm font-bold text-navy-900\">\n                                Protection gap\n                            <\/p>\n\n                            <p class=\"mt-1 text-xs text-slate-400\">\n                                Reassess when circumstances change\n                            <\/p>\n\n                        <\/div>\n\n                        <span class=\"rounded-lg bg-teal-50 px-3 py-1.5 text-xs font-bold text-teal-700\">\n                            Recheck\n                        <\/span>\n\n                    <\/div>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     HOW IT WORKS\n========================================================= -->\n\n<section\n    id=\"how-it-works\"\n    class=\"scroll-mt-32 bg-navy-900 py-24 text-white lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[0.85fr_1.15fr]\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-300\">\n                    How protection planning works\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] sm:text-5xl\">\n                    From risk to a practical response.\n                <\/h2>\n\n                <p class=\"mt-6 max-w-lg text-base leading-7 text-slate-300\">\n                    The protection process moves from identifying the financial\n                    exposure to validating a response that fits the wider plan.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"space-y-7\">\n\n                <div class=\"risk-line flex gap-5\">\n\n                    <div class=\"relative z-10 flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        01\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Identify financial risks\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Understand the exposures arising from the financial position and goals.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"risk-line flex gap-5\">\n\n                    <div class=\"relative z-10 flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        02\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Determine protection need\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Quantify the protection required using the applicable methodology.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"risk-line flex gap-5\">\n\n                    <div class=\"relative z-10 flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        03\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Compare existing protection\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Establish effective cover and the residual protection gap.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"risk-line flex gap-5\">\n\n                    <div class=\"relative z-10 flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        04\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Build possible strategies\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Consider different ways of addressing the identified gap.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"risk-line flex gap-5\">\n\n                    <div class=\"relative z-10 flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/20 text-sm font-bold\">\n                        05\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Validate the financial impact\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Check affordability, liquidity, goals and portfolio effects.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n\n                <div class=\"flex gap-5\">\n\n                    <div class=\"relative z-10 flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-teal-600 text-sm font-bold\">\n                        06\n                    <\/div>\n\n                    <div>\n\n                        <h3 class=\"text-lg font-bold\">\n                            Decide and monitor\n                        <\/h3>\n\n                        <p class=\"mt-2 text-sm leading-6 text-slate-400\">\n                            Record the decision and review the protection as circumstances change.\n                        <\/p>\n\n                    <\/div>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     CTA\n========================================================= -->\n\n<section\n    id=\"start\"\n    class=\"scroll-mt-32 py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"relative overflow-hidden rounded-[32px] bg-navy-900 px-7 py-14 sm:px-12 lg:px-16 lg:py-16\">\n\n            <div class=\"absolute -right-20 -top-20 h-72 w-72 rounded-full bg-teal-500/10 blur-3xl\"><\/div>\n\n\n            <div class=\"relative max-w-3xl\">\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-300\">\n                    Start your protection review\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-white sm:text-5xl\">\n                    Know what you are protecting — and what may still be exposed.\n                <\/h2>\n\n                <p class=\"mt-5 max-w-2xl text-base leading-7 text-slate-300\">\n                    Build the protection picture around your financial life,\n                    rather than evaluating policies in isolation.\n                <\/p>\n\n\n                <div class=\"mt-8 flex flex-col gap-3 sm:flex-row\">\n\n                    <a\n                        href=\"login.html\"\n                        class=\"inline-flex items-center justify-center gap-2 rounded-xl bg-white px-6 py-3.5 text-sm font-bold text-navy-900 transition hover:bg-slate-100\"\n                    >\n                        Start Protection Review\n                        <span>→<\/span>\n                    <\/a>\n\n                    <a\n                        href=\"decide.html\"\n                        class=\"inline-flex items-center justify-center rounded-xl border border-white/20 px-6 py-3.5 text-sm font-bold text-white transition hover:bg-white/10\"\n                    >\n                        See how decisions work\n                    <\/a>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<\/main>\n\n\n<!-- =========================================================\n     FOOTER\n========================================================= -->\n\n<footer class=\"border-t border-slate-200 bg-white\">\n\n    <div class=\"mx-auto max-w-[1200px] px-5 py-14 lg:px-8\">\n\n        <div class=\"grid gap-12 md:grid-cols-2 lg:grid-cols-[1.5fr_1fr_1fr_1fr]\">\n\n            <div>\n\n                <a\n                    href=\"index.html\"\n                    class=\"flex items-center gap-2.5\"\n                >\n\n                    <div class=\"flex h-9 w-9 items-center justify-center rounded-xl bg-navy-900\">\n\n                        <svg\n                            class=\"h-5 w-5 text-white\"\n                            viewBox=\"0 0 24 24\"\n                            fill=\"none\"\n                        >\n                            <path\n                                d=\"M5 17L10 12L13 15L19 8\"\n                                stroke=\"currentColor\"\n                                stroke-width=\"2.2\"\n                                stroke-linecap=\"round\"\n                                stroke-linejoin=\"round\"\n                            />\n\n                            <path\n                                d=\"M15 8H19V12\"\n                                stroke=\"currentColor\"\n                                stroke-width=\"2.2\"\n                                stroke-linecap=\"round\"\n                                stroke-linejoin=\"round\"\n                            />\n                        <\/svg>\n\n                    <\/div>\n\n                    <span class=\"text-xl font-extrabold tracking-tight text-navy-900\">\n                        planvesto\n                    <\/span>\n\n                <\/a>\n\n\n                <p class=\"mt-5 max-w-sm text-sm leading-7 text-slate-500\">\n                    A financial decision platform designed to help you\n                    understand your options before you act.\n                <\/p>\n\n            <\/div>\n\n\n            <div>\n\n                <h3 class=\"text-sm font-bold text-navy-900\">\n                    Plan\n                <\/h3>\n\n                <ul class=\"mt-5 space-y-3 text-sm text-slate-500\">\n\n                    <li>\n                        <a\n                            href=\"plan.html\"\n                            class=\"transition hover:text-navy-900\"\n                        >\n                            Financial Planning\n                        <\/a>\n                    <\/li>\n\n                    <li>\n                        <a\n                            href=\"plan.html#financial-health\"\n                            class=\"transition hover:text-navy-900\"\n                        >\n                            Financial Health\n                        <\/a>\n                    <\/li>\n\n                    <li>\n                        <a\n                            href=\"plan.html#goals\"\n                            class=\"transition hover:text-navy-900\"\n                        >\n                            Goals\n                        <\/a>\n                    <\/li>\n\n                    <li>\n                        <a\n                            href=\"plan.html#retirement\"\n                            class=\"transition hover:text-navy-900\"\n                        >\n                            Retirement\n                        <\/a>\n                    <\/li>\n\n                <\/ul>\n\n            <\/div>\n\n\n            <div>\n\n                <h3 class=\"text-sm font-bold text-navy-900\">\n                    Explore\n                <\/h3>\n\n                <ul class=\"mt-5 space-y-3 text-sm text-slate-500\">\n\n                    <li>\n                        <a\n                            href=\"invest.html\"\n                            class=\"transition hover:text-navy-900\"\n                        >\n                            Invest\n                        <\/a>\n                    <\/li>\n\n                    <li>\n                        <a\n                            href=\"protect.html\"\n                            class=\"font-semibold text-navy-900\"\n                        >\n                            Protect\n                        <\/a>\n                    <\/li>\n\n                    <li>\n                        <a\n                            href=\"decide.html\"\n                            class=\"transition hover:text-navy-900\"\n                        >\n                            Decide\n                        <\/a>\n                    <\/li>\n\n                    <li>\n                        <a\n                            href=\"learn.html\"\n                            class=\"transition hover:text-navy-900\"\n                        >\n                            Learn\n                        <\/a>\n                    <\/li>\n\n                <\/ul>\n\n            <\/div>\n\n\n            <div>\n\n                <h3 class=\"text-sm font-bold text-navy-900\">\n                    Company\n                <\/h3>\n\n                <ul class=\"mt-5 space-y-3 text-sm text-slate-500\">\n\n                    <li>\n                        <a\n                            href=\"about.html\"\n                            class=\"transition hover:text-navy-900\"\n                        >\n                            About Planvesto\n                        <\/a>\n                    <\/li>\n\n                    <li>\n                        <a\n                            href=\"contact.html\"\n                            class=\"transition hover:text-navy-900\"\n                        >\n                            Contact\n                        <\/a>\n                    <\/li>\n\n                    <li>\n                        <a\n                            href=\"login.html\"\n                            class=\"transition hover:text-navy-900\"\n                        >\n                            Login\n                        <\/a>\n                    <\/li>\n\n                <\/ul>\n\n            <\/div>\n\n        <\/div>\n\n\n        <div class=\"mt-12 flex flex-col gap-5 border-t border-slate-200 pt-7 sm:flex-row sm:items-center sm:justify-between\">\n\n            <p class=\"text-xs text-slate-400\">\n                © <span id=\"currentYear\"><\/span> Planvesto. All rights reserved.\n            <\/p>\n\n\n            <div class=\"flex flex-wrap gap-5 text-xs text-slate-400\">\n\n                <a\n                    href=\"privacy.html\"\n                    class=\"transition hover:text-navy-900\"\n                >\n                    Privacy Policy\n                <\/a>\n\n                <a\n                    href=\"terms.html\"\n                    class=\"transition hover:text-navy-900\"\n                >\n                    Terms & Conditions\n                <\/a>\n\n                <a\n                    href=\"disclaimer.html\"\n                    class=\"transition hover:text-navy-900\"\n                >\n                    Disclaimer\n                <\/a>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/footer>\n\n\n<!-- =========================================================\n     JAVASCRIPT\n========================================================= -->\n\n<script>\n\n    document.addEventListener('DOMContentLoaded', function () {\n\n        const menuButton = document.getElementById('menuButton');\n        const mobileMenu = document.getElementById('mobileMenu');\n        const currentYear = document.getElementById('currentYear');\n\n\n        if (currentYear) {\n            currentYear.textContent = new Date().getFullYear();\n        }\n\n\n        if (menuButton && mobileMenu) {\n\n            menuButton.addEventListener('click', function () {\n\n                const isHidden =\n                    mobileMenu.classList.contains('hidden');\n\n                mobileMenu.classList.toggle('hidden');\n\n                menuButton.setAttribute(\n                    'aria-expanded',\n                    String(isHidden)\n                );\n\n            });\n\n\n            mobileMenu\n                .querySelectorAll('a')\n                .forEach(function (link) {\n\n                    link.addEventListener('click', function () {\n\n                        mobileMenu.classList.add('hidden');\n\n                        menuButton.setAttribute(\n                            'aria-expanded',\n                            'false'\n                        );\n\n                    });\n\n                });\n\n        }\n\n    });\n\n<\/script>\n\n<\/body>\n<\/html>",
"decide.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n    <title>Decide — Planvesto<\/title>\n\n    <meta\n        name=\"description\"\n        content=\"Compare financial strategies, understand trade-offs and make better financial decisions with Planvesto.\"\n    >\n\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\n    <link\n        href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\"\n        rel=\"stylesheet\"\n    >\n\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n\n    <script>\n        tailwind.config = {\n            theme: {\n                extend: {\n                    colors: {\n                        navy: {\n                            950: '#061421',\n                            900: '#0B1F33',\n                            800: '#12304A',\n                            700: '#194563'\n                        },\n                        teal: {\n                            50: '#F0FDFA',\n                            100: '#CCFBF1',\n                            300: '#5EEAD4',\n                            500: '#14B8A6',\n                            600: '#0F766E',\n                            700: '#115E59'\n                        }\n                    },\n\n                    fontFamily: {\n                        sans: ['Inter', 'sans-serif']\n                    },\n\n                    boxShadow: {\n                        soft: '0 20px 60px rgba(11, 31, 51, 0.08)',\n                        card: '0 10px 35px rgba(11, 31, 51, 0.06)'\n                    }\n                }\n            }\n        }\n    <\/script>\n\n    <style>\n\n        html {\n            scroll-behavior: smooth;\n        }\n\n        body {\n            font-family: 'Inter', sans-serif;\n        }\n\n        .hero-grid {\n            background-image:\n                linear-gradient(rgba(11, 31, 51, 0.045) 1px, transparent 1px),\n                linear-gradient(90deg, rgba(11, 31, 51, 0.045) 1px, transparent 1px);\n            background-size: 48px 48px;\n        }\n\n        .gradient-text {\n            background: linear-gradient(135deg, #0B1F33 0%, #0F766E 100%);\n            -webkit-background-clip: text;\n            background-clip: text;\n            color: transparent;\n        }\n\n        .mobile-menu {\n            transition: all 0.2s ease;\n        }\n\n        .mobile-menu.hidden {\n            opacity: 0;\n            transform: translateY(-8px);\n            pointer-events: none;\n        }\n\n        .mobile-menu:not(.hidden) {\n            opacity: 1;\n            transform: translateY(0);\n        }\n\n        .decision-line {\n            position: relative;\n        }\n\n        .decision-line::after {\n            content: \"\";\n            position: absolute;\n            left: 20px;\n            top: 48px;\n            bottom: -28px;\n            width: 1px;\n            background: #CBD5E1;\n        }\n\n        .decision-line:last-child::after {\n            display: none;\n        }\n\n    <\/style>\n<\/head>\n\n\n<body class=\"bg-slate-50 text-slate-800 antialiased\">\n\n\n<!-- =========================================================\n     NAVIGATION\n========================================================= -->\n\n<header class=\"fixed inset-x-0 top-0 z-50 border-b border-slate-200/70 bg-white/90 backdrop-blur-xl\">\n\n    <div class=\"mx-auto flex h-20 max-w-[1200px] items-center justify-between px-5 lg:px-8\">\n\n        <a\n            href=\"index.html\"\n            class=\"flex items-center gap-2.5\"\n            aria-label=\"Planvesto Home\"\n        >\n\n            <div class=\"flex h-9 w-9 items-center justify-center rounded-xl bg-navy-900\">\n\n                <svg\n                    class=\"h-5 w-5 text-white\"\n                    viewBox=\"0 0 24 24\"\n                    fill=\"none\"\n                >\n                    <path\n                        d=\"M5 17L10 12L13 15L19 8\"\n                        stroke=\"currentColor\"\n                        stroke-width=\"2.2\"\n                        stroke-linecap=\"round\"\n                        stroke-linejoin=\"round\"\n                    />\n\n                    <path\n                        d=\"M15 8H19V12\"\n                        stroke=\"currentColor\"\n                        stroke-width=\"2.2\"\n                        stroke-linecap=\"round\"\n                        stroke-linejoin=\"round\"\n                    />\n\n                <\/svg>\n\n            <\/div>\n\n            <span class=\"text-xl font-extrabold tracking-tight text-navy-900\">\n                planvesto\n            <\/span>\n\n        <\/a>\n\n\n        <nav\n            class=\"hidden items-center gap-8 lg:flex\"\n            aria-label=\"Main navigation\"\n        >\n\n            <a\n                href=\"plan.html\"\n                class=\"text-sm font-medium text-slate-600 transition hover:text-navy-900\"\n            >\n                Plan\n            <\/a>\n\n            <a\n                href=\"invest.html\"\n                class=\"text-sm font-medium text-slate-600 transition hover:text-navy-900\"\n            >\n                Invest\n            <\/a>\n\n            <a\n                href=\"protect.html\"\n                class=\"text-sm font-medium text-slate-600 transition hover:text-navy-900\"\n            >\n                Protect\n            <\/a>\n\n            <a\n                href=\"decide.html\"\n                class=\"text-sm font-bold text-navy-900\"\n            >\n                Decide\n            <\/a>\n\n            <a\n                href=\"learn.html\"\n                class=\"text-sm font-medium text-slate-600 transition hover:text-navy-900\"\n            >\n                Learn\n            <\/a>\n\n            <a\n                href=\"about.html\"\n                class=\"text-sm font-medium text-slate-600 transition hover:text-navy-900\"\n            >\n                About\n            <\/a>\n\n        <\/nav>\n\n\n        <div class=\"hidden items-center gap-3 lg:flex\">\n\n            <a\n                href=\"login.html\"\n                class=\"rounded-xl px-4 py-2.5 text-sm font-semibold text-navy-900 transition hover:bg-slate-100\"\n            >\n                Login\n            <\/a>\n\n            <a\n                href=\"#start\"\n                class=\"rounded-xl bg-navy-900 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-navy-800\"\n            >\n                Start Planning\n            <\/a>\n\n        <\/div>\n\n\n        <button\n            id=\"menuButton\"\n            type=\"button\"\n            class=\"rounded-lg p-2 text-navy-900 lg:hidden\"\n            aria-label=\"Open navigation menu\"\n            aria-expanded=\"false\"\n        >\n\n            <svg\n                class=\"h-6 w-6\"\n                fill=\"none\"\n                stroke=\"currentColor\"\n                viewBox=\"0 0 24 24\"\n            >\n\n                <path\n                    stroke-linecap=\"round\"\n                    stroke-linejoin=\"round\"\n                    stroke-width=\"2\"\n                    d=\"M4 6h16M4 12h16M4 18h16\"\n                />\n\n            <\/svg>\n\n        <\/button>\n\n    <\/div>\n\n\n    <div\n        id=\"mobileMenu\"\n        class=\"mobile-menu hidden border-t border-slate-200 bg-white lg:hidden\"\n    >\n\n        <nav class=\"mx-auto max-w-[1200px] px-5 py-5\">\n\n            <div class=\"flex flex-col gap-1\">\n\n                <a\n                    href=\"plan.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Plan\n                <\/a>\n\n                <a\n                    href=\"invest.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Invest\n                <\/a>\n\n                <a\n                    href=\"protect.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Protect\n                <\/a>\n\n                <a\n                    href=\"decide.html\"\n                    class=\"rounded-lg bg-slate-50 px-3 py-3 text-sm font-bold text-navy-900\"\n                >\n                    Decide\n                <\/a>\n\n                <a\n                    href=\"learn.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    Learn\n                <\/a>\n\n                <a\n                    href=\"about.html\"\n                    class=\"rounded-lg px-3 py-3 text-sm font-medium hover:bg-slate-50\"\n                >\n                    About\n                <\/a>\n\n\n                <div class=\"mt-3 grid grid-cols-2 gap-3 border-t border-slate-100 pt-4\">\n\n                    <a\n                        href=\"login.html\"\n                        class=\"rounded-xl border border-slate-200 px-4 py-3 text-center text-sm font-semibold text-navy-900\"\n                    >\n                        Login\n                    <\/a>\n\n                    <a\n                        href=\"#start\"\n                        class=\"rounded-xl bg-navy-900 px-4 py-3 text-center text-sm font-semibold text-white\"\n                    >\n                        Start Planning\n                    <\/a>\n\n                <\/div>\n\n            <\/div>\n\n        <\/nav>\n\n    <\/div>\n\n<\/header>\n\n\n<main>\n\n\n<!-- =========================================================\n     HERO\n========================================================= -->\n\n<section class=\"hero-grid relative overflow-hidden pt-32 lg:pt-40\">\n\n    <div class=\"absolute inset-x-0 top-0 -z-10 h-[560px] bg-gradient-to-b from-teal-50/80 to-transparent\"><\/div>\n\n\n    <div class=\"mx-auto max-w-[1200px] px-5 pb-20 lg:px-8 lg:pb-28\">\n\n        <div class=\"grid items-center gap-14 lg:grid-cols-[1fr_0.9fr]\">\n\n            <div>\n\n                <div class=\"mb-6 inline-flex items-center gap-2 rounded-full border border-teal-100 bg-teal-50 px-3.5 py-2\">\n\n                    <span class=\"h-2 w-2 rounded-full bg-teal-600\"><\/span>\n\n                    <span class=\"text-xs font-semibold tracking-wide text-teal-700\">\n                        Financial decisions\n                    <\/span>\n\n                <\/div>\n\n\n                <h1 class=\"max-w-3xl text-5xl font-extrabold leading-[1.06] tracking-[-0.04em] text-navy-900 sm:text-6xl\">\n\n                    Don't just choose an option.\n\n                    <span class=\"gradient-text\">\n                        Understand the decision.\n                    <\/span>\n\n                <\/h1>\n\n\n                <p class=\"mt-7 max-w-2xl text-lg leading-8 text-slate-600\">\n                    Compare financial strategies, see what could happen under\n                    different scenarios and understand the trade-offs before\n                    deciding what to do.\n                <\/p>\n\n\n                <div class=\"mt-9 flex flex-col gap-3 sm:flex-row\">\n\n                    <a\n                        href=\"#start\"\n                        class=\"inline-flex items-center justify-center gap-2 rounded-xl bg-navy-900 px-6 py-3.5 text-sm font-semibold text-white shadow-lg shadow-navy-900/10 transition hover:bg-navy-800\"\n                    >\n                        Explore Your Decision\n\n                        <svg\n                            class=\"h-4 w-4\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n\n                            <path\n                                d=\"M5 12h14M13 6l6 6-6 6\"\n                                stroke-width=\"1.8\"\n                                stroke-linecap=\"round\"\n                                stroke-linejoin=\"round\"\n                            />\n\n                        <\/svg>\n\n                    <\/a>\n\n\n                    <a\n                        href=\"#how-it-works\"\n                        class=\"inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-6 py-3.5 text-sm font-semibold text-navy-900 transition hover:bg-slate-50\"\n                    >\n                        How it works\n                    <\/a>\n\n                <\/div>\n\n            <\/div>\n\n\n            <!-- Decision Preview -->\n\n            <div class=\"relative\">\n\n                <div class=\"absolute -inset-5 rounded-[32px] bg-teal-100/50 blur-3xl\"><\/div>\n\n\n                <div class=\"relative rounded-[28px] border border-slate-200 bg-white p-6 shadow-soft sm:p-7\">\n\n                    <div class=\"flex items-center justify-between border-b border-slate-100 pb-5\">\n\n                        <div>\n\n                            <p class=\"text-xs font-semibold uppercase tracking-wider text-slate-400\">\n                                Example decision\n                            <\/p>\n\n                            <h2 class=\"mt-1 text-lg font-bold text-navy-900\">\n                                Retirement funding\n                            <\/h2>\n\n                        <\/div>\n\n                        <span class=\"rounded-xl bg-teal-50 px-3 py-2 text-xs font-bold text-teal-700\">\n                            Compare\n                        <\/span>\n\n                    <\/div>\n\n\n                    <div class=\"mt-6 space-y-3\">\n\n                        <div class=\"rounded-2xl border border-teal-200 bg-teal-50 p-4\">\n\n                            <div class=\"flex items-center justify-between\">\n\n                                <div>\n\n                                    <p class=\"text-xs font-semibold uppercase tracking-wider text-teal-700\">\n                                        Option A\n                                    <\/p>\n\n                                    <p class=\"mt-1 text-sm font-bold text-navy-900\">\n                                        Increase contribution\n                                    <\/p>\n\n                                <\/div>\n\n                                <span class=\"rounded-lg bg-white px-2.5 py-1 text-xs font-bold text-teal-700\">\n                                    Selected\n                                <\/span>\n\n                            <\/div>\n\n                            <div class=\"mt-4 grid grid-cols-2 gap-3\">\n\n                                <div>\n\n                                    <p class=\"text-[11px] text-slate-400\">\n                                        Monthly change\n                                    <\/p>\n\n                                    <p class=\"mt-1 text-sm font-bold text-navy-900\">\n                                        +₹10,000\n                                    <\/p>\n\n                                <\/div>\n\n                                <div>\n\n                                    <p class=\"text-[11px] text-slate-400\">\n                                        Goal impact\n                                    <\/p>\n\n                                    <p class=\"mt-1 text-sm font-bold text-navy-900\">\n                                        Improved\n                                    <\/p>\n\n                                <\/div>\n\n                            <\/div>\n\n                        <\/div>\n\n\n                        <div class=\"rounded-2xl border border-slate-200 bg-slate-50 p-4\">\n\n                            <div class=\"flex items-center justify-between\">\n\n                                <div>\n\n                                    <p class=\"text-xs font-semibold uppercase tracking-wider text-slate-400\">\n                                        Option B\n                                    <\/p>\n\n                                    <p class=\"mt-1 text-sm font-bold text-navy-900\">\n                                        Retain current funding\n                                    <\/p>\n\n                                <\/div>\n\n                                <span class=\"text-xs font-semibold text-slate-400\">\n                                    Alternative\n                                <\/span>\n\n                            <\/div>\n\n                        <\/div>\n\n\n                        <div class=\"rounded-2xl border border-slate-200 bg-slate-50 p-4\">\n\n                            <div class=\"flex items-center justify-between\">\n\n                                <div>\n\n                                    <p class=\"text-xs font-semibold uppercase tracking-wider text-slate-400\">\n                                        Option C\n                                    <\/p>\n\n                                    <p class=\"mt-1 text-sm font-bold text-navy-900\">\n                                        Change retirement assumptions\n                                    <\/p>\n\n                                <\/div>\n\n                                <span class=\"text-xs font-semibold text-slate-400\">\n                                    Alternative\n                                <\/span>\n\n                            <\/div>\n\n                        <\/div>\n\n                    <\/div>\n\n\n                    <div class=\"mt-5 border-t border-slate-100 pt-5\">\n\n                        <div class=\"flex items-start gap-3\">\n\n                            <div class=\"mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-navy-900 text-white\">\n\n                                <svg\n                                    class=\"h-3.5 w-3.5\"\n                                    fill=\"none\"\n                                    stroke=\"currentColor\"\n                                    viewBox=\"0 0 24 24\"\n                                >\n\n                                    <path\n                                        d=\"M12 8v4l3 2\"\n                                        stroke-width=\"1.8\"\n                                        stroke-linecap=\"round\"\n                                        stroke-linejoin=\"round\"\n                                    />\n\n                                    <circle\n                                        cx=\"12\"\n                                        cy=\"12\"\n                                        r=\"8\"\n                                        stroke-width=\"1.8\"\n                                    />\n\n                                <\/svg>\n\n                            <\/div>\n\n                            <p class=\"text-xs leading-5 text-slate-500\">\n                                The right decision depends on goals,\n                                constraints, assumptions and the consequences\n                                of each alternative.\n                            <\/p>\n\n                        <\/div>\n\n                    <\/div>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     CORE MESSAGE\n========================================================= -->\n\n<section class=\"border-y border-slate-200 bg-white\">\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid divide-y divide-slate-200 md:grid-cols-3 md:divide-x md:divide-y-0\">\n\n            <div class=\"px-0 py-10 md:px-8 md:first:pl-0\">\n\n                <p class=\"text-3xl font-extrabold tracking-tight text-navy-900\">\n                    Compare\n                <\/p>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Look at relevant alternatives instead of evaluating one option in isolation.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"px-0 py-10 md:px-8\">\n\n                <p class=\"text-3xl font-extrabold tracking-tight text-navy-900\">\n                    Test\n                <\/p>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Understand how different assumptions and scenarios can change the outcome.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"px-0 py-10 md:px-8 md:pr-0\">\n\n                <p class=\"text-3xl font-extrabold tracking-tight text-navy-900\">\n                    Decide\n                <\/p>\n\n                <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                    Move from analysis to a clear financial plan and practical actions.\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     WHY DECISIONS ARE HARD\n========================================================= -->\n\n<section class=\"py-24 lg:py-32\">\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"grid gap-14 lg:grid-cols-[0.8fr_1.2fr] lg:items-start\">\n\n            <div>\n\n                <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                    The problem\n                <\/p>\n\n                <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                    Financial decisions are rarely about one number.\n                <\/h2>\n\n                <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                    A change that improves one part of your financial life can\n                    affect another. Increasing investment, for example, can\n                    change liquidity. Increasing protection can change surplus.\n                    Changing a goal can change the required funding.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"grid gap-4 sm:grid-cols-2\">\n\n                <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                    <div class=\"flex h-10 w-10 items-center justify-center rounded-xl bg-slate-100 text-navy-900\">\n\n                        <svg\n                            class=\"h-5 w-5\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n\n                            <path\n                                d=\"M5 19V9M12 19V5M19 19v-8\"\n                                stroke-width=\"1.8\"\n                                stroke-linecap=\"round\"\n                            />\n\n                        <\/svg>\n\n                    <\/div>\n\n                    <h3 class=\"mt-5 font-bold text-navy-900\">\n                        Goals\n                    <\/h3>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        What outcome are you actually trying to achieve?\n                    <\/p>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                    <div class=\"flex h-10 w-10 items-center justify-center rounded-xl bg-teal-50 text-teal-700\">\n\n                        <svg\n                            class=\"h-5 w-5\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n\n                            <path\n                                d=\"M12 3v18M7 8h8a3 3 0 010 6H9a3 3 0 000 6h8\"\n                                stroke-width=\"1.8\"\n                                stroke-linecap=\"round\"\n                            />\n\n                        <\/svg>\n\n                    <\/div>\n\n                    <h3 class=\"mt-5 font-bold text-navy-900\">\n                        Cash flow\n                    <\/h3>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        What can you actually afford without weakening the plan?\n                    <\/p>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                    <div class=\"flex h-10 w-10 items-center justify-center rounded-xl bg-slate-100 text-navy-900\">\n\n                        <svg\n                            class=\"h-5 w-5\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n\n                            <path\n                                d=\"M12 3l8 4v5c0 4.8-3.4 7.9-8 9-4.6-1.1-8-4.2-8-9V7l8-4z\"\n                                stroke-width=\"1.8\"\n                                stroke-linejoin=\"round\"\n                            />\n\n                        <\/svg>\n\n                    <\/div>\n\n                    <h3 class=\"mt-5 font-bold text-navy-900\">\n                        Risk\n                    <\/h3>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        What risks and constraints need to be respected?\n                    <\/p>\n\n                <\/div>\n\n\n                <div class=\"rounded-2xl border border-slate-200 bg-white p-6 shadow-card\">\n\n                    <div class=\"flex h-10 w-10 items-center justify-center rounded-xl bg-slate-100 text-navy-900\">\n\n                        <svg\n                            class=\"h-5 w-5\"\n                            fill=\"none\"\n                            stroke=\"currentColor\"\n                            viewBox=\"0 0 24 24\"\n                        >\n\n                            <path\n                                d=\"M4 19h16M6 16V8M10 16V5M14 16v-4M18 16V7\"\n                                stroke-width=\"1.8\"\n                                stroke-linecap=\"round\"\n                            />\n\n                        <\/svg>\n\n                    <\/div>\n\n                    <h3 class=\"mt-5 font-bold text-navy-900\">\n                        Trade-offs\n                    <\/h3>\n\n                    <p class=\"mt-2 text-sm leading-6 text-slate-500\">\n                        What do you gain, give up or change with each alternative?\n                    <\/p>\n\n                <\/div>\n\n            <\/div>\n\n        <\/div>\n\n    <\/div>\n\n<\/section>\n\n\n<!-- =========================================================\n     SCENARIOS\n========================================================= -->\n\n<section\n    id=\"scenarios\"\n    class=\"bg-white py-24 lg:py-32\"\n>\n\n    <div class=\"mx-auto max-w-[1200px] px-5 lg:px-8\">\n\n        <div class=\"max-w-3xl\">\n\n            <p class=\"text-sm font-bold uppercase tracking-widest text-teal-700\">\n                Scenarios\n            <\/p>\n\n            <h2 class=\"mt-4 text-4xl font-extrabold tracking-[-0.03em] text-navy-900 sm:text-5xl\">\n                Don't only ask \"what should I do?\"\n            <\/h2>\n\n            <p class=\"mt-5 text-lg leading-8 text-slate-600\">\n                Ask what happens if you choose one path instead of another.\n            <\/p>\n\n        <\/div>\n\n\n        <div class=\"mt-14 grid gap-5 lg:grid-cols-3\">\n\n            <div class=\"rounded-[24px] border border-slate-200 bg-slate-50 p-7\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-white text-navy-900 shadow-sm\">\n\n                    <span class=\"text-sm font-extrabold\">\n                        01\n                    <\/span>\n\n                <\/div>\n\n                <h3 class=\"mt-6 text-xl font-bold text-navy-900\">\n                    Baseline\n                <\/h3>\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    Establish the current financial position and assumptions\n                    against which alternatives can be considered.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-[24px] border border-teal-100 bg-teal-50 p-7\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-white text-teal-700 shadow-sm\">\n\n                    <span class=\"text-sm font-extrabold\">\n                        02\n                    <\/span>\n\n                <\/div>\n\n                <h3 class=\"mt-6 text-xl font-bold text-navy-900\">\n                    Change an assumption\n                <\/h3>\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    Test a strategy or changed assumption and see how the\n                    resulting financial position could differ.\n                <\/p>\n\n            <\/div>\n\n\n            <div class=\"rounded-[24px] border border-slate-200 bg-slate-50 p-7\">\n\n                <div class=\"flex h-11 w-11 items-center justify-center rounded-xl bg-white text-navy-900 shadow-sm\">\n\n                    <span class=\"text-sm font-extrabold\">\n                        03\n                    <\/span>\n\n                <\/div>\n\n                <h3 class=\"mt-6 text-xl font-bold text-navy-900\">\n                    Compare outcomes\n                <\/h3>\n\n                <p class=\"mt-3 text-sm leading-7 text-slate-500\">\n                    See the consequences and trade-offs before selecting a path.\n                <\/p>\n\n            <\/div>\n\n        <\/div>\n\n\n        <!-- Scenario comparison -->\n\n        <div class=\"mt-8 overflow-hidden rounded-[28px] border border-slate-200 bg-white shadow-card\">\n\n            <div class=\"border-b border-slate-200 bg-slate-50 px-6 py-5 sm:px-8\">\n\n                <div class=\"flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between\">\n\n                    <div>\n\n                        <p class=\"text-xs font-bold uppercase tracking-wider text-slate-400\">\n                            Illustrative comparison\n                        <\/p>\n\n                        <h3 class=\"mt-1 text-lg font-bold text-navy-900\">\n                            Retirement funding alternatives\n                        <\/h3>\n\n                    <\/div>\n\n                    <span class=\"text-xs font-medium text-slate-400\">\n                        Example only\n                    <\/span>\n\n                <\/div>\n\n            <\/div>\n\n\n            <div class=\"overflow-x-auto\">\n\n                <table class=\"w-full min-w-[680px] border-collapse text-left\">\n\n                    <thead>\n\n                        <tr class=\"border-b border-slate-200\">\n\n                            <th class=\"px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-400 sm:px-8\">\n                                Consideration\n                            <\/th>\n\n                            <th class=\"px-6 py-4 text-xs font-bold uppercase tracking-wider text-teal-700\">\n                                Increase funding\n                            <\/th>\n\n                            <th class=\"px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-400\">\n                                Current funding\n                            <\/th>\n\n                            <th class=\"px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-400\">\n                                Change horizo
